        <!--
          [SL-355] 开窗白闪那一段的根元素底色:**内联、字面量、不依赖任何外链请求的结果**。
          ⚠ 排在两条 <link rel="stylesheet"> 之前是**排序事实,不是时序保证** —— Chromium
          对 <head> 里的外链样式表是渲染阻塞的。这条声明确定兜住的是哪两条路、哪一条只有
          真机能判,连同「灰 / 白 / 内容」三段的来源与代码证据,只写在一处:
          src/plugin-common/WebViewHost.cpp 的 HostWebView::paint 头注。别在这里复述。
          这一条**必须是字面量**:自定义属性一律定义在 tokens.css 里,写成 var() 就又回到
          「等外链」那条路上。⚠ [SL-377] 尤其不要写成 var(--page-backdrop):那个变量已改作
          **外圈色**(外壳圆角之外那一圈,深色),与本条的**占位**是两个角色、取值不同。
          ⚠ [SL-402] 取值从单色升成**渐变**字面量:与 tokens.css `--page-gradient` 同一组
          色标(157deg),让「加载中的占位」与「打开后的底」同形、开窗切内容不再有明暗差。
          C++ 真源 = src/plugin-common/PlatformWebView.h 的 kShellBackdropStops,由
          web-preview/tests/smoke-embedded-resources.mjs 的 ⑥ 与 C++ 色标数组逐字对拍
          (改一边不改另一边即红),故此处仍是本页「零裸 hex」纪律的**唯一**例外。
          [第 1 推] `min-height: 100%` 与 `background-attachment: fixed` 两行是兜路的一半:
          background 简写会把 background-color 重置成 transparent,根元素的背景**图**按
          根元素自身盒定尺寸 —— 外链 base.css(带 height:100%)缺席时,没有这两行的话
          图的尺寸会塌成内容高、甚至不绘制,兜路反而露白。⑥ 逐字钉这两条声明与
          background 同块在场,页面级 A9 钉 applied cascade(backgroundAttachment=fixed)。
        -->
        <style>
            html {
                background: linear-gradient(
                    157deg,
                    #b5acc9 0%,
                    #ccbfd5 32%,
                    #e3d2e0 64%,
                    #fde8ed 100%

                min-height: 100%;
                background-attachment: fixed;

        <!--
          boot 守卫 —— 前端起不来时主动告诉 native,别让宿主干等看门狗超时。
          必须是 <head> 里的**普通 script**(非 module)且排在所有资源之前:module 自身
          解析/加载失败时,module 内的 try/catch 一行都跑不到,只有先注册的全局监听接得住。
          通道 = JUCE 内建的 window.__JUCE__.postMessage(JUCE 在文档创建前注入,不经
          bridge.js、不占契约 §7 名表);事件名真源 = src/plugin-common/WebViewHost.h 的
          kBootErrorEventId。浏览器预览下没有 __JUCE__,report 静默返回。
        -->
        <script>
            (function () {
                var sent = false;
                function report(stage, detail) {
                    if (sent) return; // 只报第一条:后面多半是同一次失败的连锁反应
                    sent = true;
                    try {
                        var juce = window.__JUCE__;
                        if (!juce || typeof juce.postMessage !== "function")
                            return;
                        juce.postMessage(
                            JSON.stringify({
                                eventId: "__scvb__bootError",
                                payload: {
                                    stage: stage,
                                    detail: String(detail).slice(0, 300),
                                },
                            }),
                        );
                    } catch (e) {
                        // 上报本身失败就沉默 —— 此时还能兜底的只剩 native 看门狗
                    }
                }
                // capture 相:资源级失败(script/link 取不到、MIME 不对)不冒泡,只有捕获阶段收得到。
                // 只认 SCRIPT/LINK —— 图片之类的失败不该把整个界面换成兜底面板。
                window.addEventListener(
                    "error",
                    function (e) {
                        var t = e && e.target;
                        if (t && t !== window && (t.src || t.href)) {
                            if (t.tagName === "SCRIPT" || t.tagName === "LINK")
                                report("resource", t.src || t.href);
                            return;
                        }
                        report("script", (e && e.message) || "unknown error");
                    },
                    true,
                );
                window.addEventListener("unhandledrejection", function (e) {
                    var r = e && e.reason;
                    report(
                        "promise",
                        (r && (r.stack || r.message)) ||
                            r ||
                            "unhandled rejection",
                    );
                });
                window.__scvbReportBootError = report;
            })();
        </script>

        <!--
          [SL-370] 「首帧已绘」上行信号 —— 开窗遮挡闸的第一条放行路。
          C++ 侧在导航开始后把 WebView 子窗口挪出宿主可视区、由 WebViewHost::paint 铺占位底色,
          收到这条信号(**[SL-376] 起它是唯一的正常放行路**;pageFinishedLoading 不再放行,
          只剩 3s 超时兜底)才放回来。机理、为什么是
          「挪走」而不是隐藏、为什么要等导航开始,只写在 src/plugin-common/WebViewRevealGate.h
          一处,别在这里复述。
          通道与上面的 boot 守卫同一条(JUCE 内建 __JUCE__.postMessage,不经 bridge.js、
          不占契约 §7 名表);事件名真源 = src/plugin-common/WebViewHost.h 的 kFirstFrameEventId。
          武装的触发条件是「**页面真的画过一帧**」(paint 记录到达),不是 DOMContentLoaded:
          [SL-429] 实测两层 rAF **并不**保证已经画过 —— 按 DCL 触发时信号时刻 ≈ DCL + 两个
          rAF,与 first-paint 之间没有任何约束(本机实测 input 页上早到 −369 ms)。
          两层 rAF 仍然保留(再等一拍,让已画的那一帧提交给合成器)。完整定谳与三页数表只写在
          src/plugin-common/WebViewRevealGate.h 一处,别在这里复述;回落与保险两条路的理由
          (尤其保险为什么**不能**绕两层 rAF)写在下面它们各自那里。
          判据 = 节点侧 ⑦(源码形态)+ 页面级 smoke-first-frame-page(信号晚于 first-paint)。
          浏览器预览下没有 __JUCE__,静默返回。
        -->
        <script>
            (function () {
                // [SL-430 前半] paint 记录到达时把它的 startTime 记下来,信号发出时算差值。
                // −1 = 这一次没有 paint 记录(走了回落路或保险路)。
                var paintStartMs = -1;
                // [SL-429 第 3 轮] `sent` 与「撤网」都落在 signal() 里,不在 armOnce() 里。
                // 上一版在 armOnce() 里先 clearTimeout 再把事交给 arm() 的两层 rAF ——
                // **网撤在「信号还没发出去」之前**,而撤网后剩下的那一段恰恰就是
                // BeginFrame 停摆那一档下不回调的东西:paint 到达 → 撤网 → 排 rAF →
                // 此刻窗口被最小化 / 被完全遮挡 / DAW 弹模态框把合成停了 ⇒ 两层 rAF 永不回调,
                // 而保险已经没了 ⇒ 仍旧掉进 C++ 的超时兜底。现在网**只在信号真发出去的那一刻**
                // 才撤,`sent` 兼做去重(保险与 rAF 都可能跑到这里)。
                // ⚠ [SL-437] 上面这句当时只搬对了「哪个函数」,没搬对「函数里的哪一行」——
                // `sent = true` 与 `clearTimeout(guard)` 曾经紧跟在 `signal()` 入口,排在
                // `__JUCE__` 存在性检查**之前**:守卫不满足时两行照样执行,撤网即成立、
                // 但 `postMessage` 从未被调用过,保险因此空转。现在这两行移到 `postMessage`
                // **调用之后**,见 signal() 内部注释。
                var sent = false;
                function signal() {
                    if (sent) return;
                    try {
                        var juce = window.__JUCE__;
                        if (!juce || typeof juce.postMessage !== "function")
                            return;
                        // [SL-430 前半] 载荷里带上「信号时刻 − first-paint 时刻」这个**差值**。
                        // ⚠ **送差值,不送 paint 的绝对时刻** —— 页面的 performance 时间轴与
                        // C++ 的 startMs_ **不共享原点**,送绝对值那一端根本没法算,只会得到
                        // 一个看着像时刻、其实无法与任何东西相减的数。这正是本卡第 2 轮复审
                        // 在「2500 vs 3000 不同源」上教的那一课,原样用在这里。
                        // 用途:用户机上的 `signal − first-paint` 余量此前**从来没被量过**,
                        // 只能从 A/B 差值反推;有了这一格,一份日志就能直接读出来。
                        // 没有 paint 记录时**不带这个字段**,C++ 那行会打 `(no paint record)`。
                        // ⚠ [SL-429 第 4 轮] **反过来读不成立**:上一轮把去重挪进本函数之后,
                        // 保险的回调不再查 `armed` ⇒ 「paint 已到、两层 rAF 还没跑完就到 2.5s」
                        // 这一路会**带着一个真实的差值**由保险发出。所以「有这个字段」
                        // **≠**「走的是 paint 路」;**判保险路要看诊断行 `after N ms` 的量级
                        // (≈2500),不是看这个字段在不在**。那个数本身仍是真读数,不是脏数。
                        var p = {};
                        if (paintStartMs >= 0)
                            p.paintDeltaMs = Math.round(
                                performance.now() - paintStartMs,
                            );
                        juce.postMessage(
                            JSON.stringify({
                                eventId: "__scvb__firstFrame",
                                payload: p,
                            }),
                        );
                        // [SL-437] 撤网必须落在 postMessage **之后**:撤在它之前的话,
                        // __JUCE__ 缺席 / postMessage 不是函数时上面两个 `return` 会在
                        // 网已经撤了、信号却从没真的发出去的状态下退出 —— 保险彻底空转。
                        sent = true;
                        if (guard !== null) {
                            clearTimeout(guard);
                            guard = null;
                        }
                    } catch (e) {
                        // 发不出去也不许卡住:C++ 侧还有 3s 超时兜底。
                        // ⚠ [SL-376] 起兜底只剩这一条(pageFinishedLoading 不再放行,
                        // 因为它不保证任何一帧已经合成)—— 所以这条信号丢了的代价是
                        // 「每次开窗多等 3 秒占位」,不是「少等几毫秒」。别把它当可有可无。
                        // ⚠ [SL-437 复审] 若 `postMessage` 在**载荷已经投递之后**才抛(比如
                        // 宿主那侧的回调抛错),这里会把异常吞掉、`sent` 仍是 false ⇒ 2.5s
                        // 保险会把这条信号**重发一次**。机制:C++ 侧 `RevealGate::onFirstFrame()`
                        // 对重复调用是**幂等**的 —— `settling_` 已为 true 时整段直接跳过,
                        // 不会重置 `settleAtMs_`/`settleTicksSeen_`(见 WebViewRevealGate.h)。
                        // 故意不改成别的写法:这里选的是「可能重发」,不是「可能丢失」。
                    }
                }
                function arm() {
                    if (typeof window.requestAnimationFrame !== "function") {
                        signal();
                        return;
                    }
                    window.requestAnimationFrame(function () {
                        window.requestAnimationFrame(signal);
                    });
                }
                // [SL-429] 触发条件 = 「已经画过一帧」,不是 DOMContentLoaded。理由见上面的
                // HTML 注释与 src/plugin-common/WebViewRevealGate.h。
                var armed = false;
                var guard = null;
                function armOnce() {
                    if (armed) return;
                    armed = true;
                    arm();
                }
                // [SL-429 第 3 轮] 保险**排在 try 之前**,不在 try 里面。
                // 上一版把它排在 `po.observe()` 之后 ⇒ `new PerformanceObserver` 抛错时
                // 直接跳进 catch,**这一行根本没执行过** ⇒ 回落路(只有 DCL + 两层 rAF)
                // 压根没有保险,BeginFrame 停摆那一档下同样永不发出。而 ⑦ 的 (d) 当时
                // 正在为「paint 记录不到达时这条信号不许变成永不发出」发合格证 ——
                // 那句话对回落路是假的。排在这里之后,**三条路(paint / 回落 / 保险自己)
                // 都被同一张网兜住**,而且这张网不由 BeginFrame 驱动(setTimeout 不是 rAF)。
                // ⚠ 它与 C++ 的 kRevealFallbackMs(3000ms)**不共享时间原点**:后者从
                // onNavigationStarted 起算,本行从**这段内联脚本执行**起算,中间隔着
                // 「导航开始 → 文档送达 → <head> 解析」。真实余量是
                // `500ms − (导航开始 → 本脚本执行)`,**不是 500ms**;那一段一旦超过 500ms
                // (冷起、机器吃紧),保险就跑输 C++ 兜底,放行原因还是掉成 timeout。
                // 而且**这件事从抓取包里看不出来**(`navigation started` 那行不带时间戳)——
                // 那是 SL-430 的后半,仍封存。
                // 回调只写一句 signal():**不绕 arm() 的两层 rAF**,理由同上(BeginFrame 停了
                // rAF 也不回调,绕过去等于这条保险不存在)。去重与撤网都在 signal() 里。
                guard = setTimeout(function () {
                    signal();
                }, 2500);
                try {
                    var po = new PerformanceObserver(function (list) {
                        if (list.getEntries().length === 0) return;
                        paintStartMs = list.getEntries()[0].startTime;
                        try {
                            po.disconnect();
                        } catch (e) {}
                        armOnce();
                    });
                    // buffered:true —— paint 记录可能在本脚本跑之前就产生了。
                    po.observe({ type: "paint", buffered: true });
                } catch (e) {
                    // 没有 PerformanceObserver:回落 [SL-370] 的旧触发,不许变成永不放行。
                    // ⚠ 这个 catch **只覆盖「压根没有 PerformanceObserver」**(以及只认
                    // entryTypes 的史前实现)。「有 PerformanceObserver、但它不报 paint 记录」
                    // **不会抛异常** —— 规范要求未知 type 直接 abort + 控制台 warning。那一档
                    // 落在上面那条保险上:代价是「多等 2.5s 占位」,不是「永不放行」。
                    if (document.readyState === "loading")
                        document.addEventListener("DOMContentLoaded", armOnce);
                    else armOnce();
                }
            })();
        </script>

        <style>

               注回即红)。
               [SL-422] 用户回验 v5.6.15:深墨底(当时是 --acc-ink #241f2e)读作「黑」,
               与整窗粉紫不同族、显丑。用户拍板**只换底色值、不动形态**:底改成用户指定的
               深紫 --acc-chip-violet(tokens.css §4;为本钮新增,选型理由与「为什么不复用
               既有紫」记在该条注释),图标 / 形状 / 描边一字未动。A8 两格照守 ——
               换的是色值,判据钉的是**算出来的对比度**,不是色值字面量。 */
            .ipt-help {
                flex: none;
                width: 22px;
                height: 22px;
                padding: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                font-family: var(--ff-mono);
                font-size: var(--fs-105);
                line-height: 1;
                background: var(--acc-chip-violet);
                color: var(--txt-dark-1);
            }
            /* 组 badge(J71③:独立「组 {X}」badge,不是 pill 后缀;空/未连接态同样常显) */
            .ipt-group-badge {
                display: inline-flex;
                align-items: center;
                gap: var(--sp-5);
                flex: none;
                padding: var(--sp-4) var(--sp-10);
                border-radius: var(--r-pill);
                background: var(--w-24);
                border: 1px solid rgba(var(--wh), 0.44);
                box-shadow: inset 0 1px 0 rgba(var(--wh), 0.6);
                font-family: var(--ff-mono);
                font-size: var(--fs-100);
                letter-spacing: var(--mono-ls);
                color: var(--txt-1);
                white-space: nowrap;
            }

            /* ---- 警告条区(§3:group.noOutput 引导 + abiMismatch 红横幅) */
            .ipt-banner-zone {
                flex: none;
                display: flex;
                flex-direction: column;
                gap: var(--sp-7);
            }

            /* ---- 内容区(flex column, gap 14,可纵向滚动守 560px 高度) */
            .ipt-content {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: var(--sp-14);
            }
            .ipt-panel {
                flex: none;
                padding: var(--sp-13);
                display: flex;
                flex-direction: column;
                gap: var(--sp-10);
            }
            /* 引导副行是正文级信息(非辅助标签),不下沉到 .sc-hint 的 --txt-4 幽灵灰 */
            .ipt-content .sc-hint {
                color: var(--txt-2);
            }

            /* ---- 组选择器(05 §3:压通道网格顶行、比卡片矮一档;胶囊族样式) */
            .ipt-group__head {
                display: flex;
                align-items: center;
                gap: var(--sp-8);
            }
            .ipt-group__pills {
                display: inline-flex;
                flex-wrap: wrap;
                gap: var(--sp-2);
                padding: var(--sp-3);
                border-radius: var(--r-pill);
                background: rgba(var(--wh), 0.14);
                border: 1px solid rgba(var(--wh), 0.28);
            }
            .ipt-group__pill {
                position: relative;
                display: inline-flex;
                align-items: center;
                gap: var(--sp-4);
                padding: var(--sp-4) var(--sp-9);
                border-radius: var(--r-pill);
                cursor: pointer;
                font-family: var(--ff-mono);
                font-size: var(--fs-105);
                font-weight: 500;
                letter-spacing: var(--mono-ls-tag);
                background: transparent;
                border: 0;
                color: var(--txt-3);
                transition: background var(--dur-1) var(--ease);
            }
            .ipt-group__pill[aria-selected="true"] {
                background: var(--seg-on-bg);
                color: var(--acc-ink);
            }
            .ipt-group__pill[data-pending="1"] {
                background: rgba(var(--sem-amber), 0.22);
                color: var(--sem-amber-ink);
            }
            .ipt-group__pill .sc-dot {
                width: 4px;
                height: 4px;
                background: rgb(var(--sem-green));
            }
            .ipt-group__pill[data-online="0"] .sc-dot {
                display: none;
            }
            .ipt-group__warn {
                color: var(--sem-red-ink);
                font-weight: 600;
                font-size: var(--fs-100);
                line-height: 1.45;
                text-wrap: pretty;
            }
            .ipt-hr {
                width: auto;
                height: 1px;
                align-self: stretch;
            }

            /* ---- 通道选择器:4×4 紧凑网格(05 §3) */
            .ipt-channels__grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: var(--sp-6);
            }
            .ipt-chcard {
                position: relative;
                min-height: 40px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: var(--sp-2);
                padding: var(--sp-4);
                line-height: 1;
                cursor: pointer;
                border-radius: var(--r-sm);
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                color: var(--txt-2);
                font-family: var(--ff-sans);
            }
            .ipt-chcard[aria-pressed="true"] {
                background: rgba(var(--wh), 0.85);
                color: var(--txt-1);
            }
            .ipt-chcard__num {
                font-family: var(--ff-mono);
                font-size: var(--fs-115);
                font-weight: 500;
                letter-spacing: 0.08em;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            .ipt-chcard__label {
                font-size: var(--fs-80);
                color: var(--txt-4);
                line-height: 1;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .ipt-chcard__label:empty {
                display: none;
            }
            /* 占用文字标(A8 缺件:右上角灰点 + 「占用」文字标) */
            .ipt-chcard__occupied {
                position: absolute;
                top: 3px;
                right: 3px;
                display: inline-flex;
                align-items: center;
                gap: var(--sp-3);
                font-family: var(--ff-mono);
                font-size: var(--fs-75);
                letter-spacing: var(--mono-ls-tag);
                color: var(--sem-gray-ink);
            }
            .ipt-chcard__occupied .sc-dot {
                width: 4px;
                height: 4px;
            }

            /* ---- 本轨 mono/stereo 实测结果(J57,只读) */
            .ipt-source {
                display: flex;
                align-items: center;
                gap: var(--sp-7);
            }
            .ipt-source .sc-badge {
                font-size: var(--fs-90);
                letter-spacing: var(--mono-ls);
            }

            .ipt-manual {
                display: flex;
                align-items: center;
                gap: var(--sp-8);
            }
            .ipt-manual__input {
                width: 52px;
                font-family: var(--ff-mono);
                font-size: var(--fs-105);
                color: var(--txt-2);
                background: rgba(var(--wh), 0.34);
                border: 1px solid rgba(var(--wh), 0.5);
                border-radius: var(--r-micro);
                padding: var(--sp-3) var(--sp-7);
            }

            /* ---- 优先级滑杆(05 §3 stepper → range,用户 2026-08-23 preview 指令;
                基础 range 样式(tokens.css/base.css 的 accent-color/height/width)已全站一致) */
            .ipt-priority {
                display: flex;
                align-items: center;
                gap: var(--sp-12);
            }
            input.ipt-priority__slider {
                flex: 1;
                min-width: 0;
                height: var(--fs-140);
            }
            .ipt-priority__slider[disabled] {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .ipt-priority__val {
                font-size: var(--fs-200);
                line-height: 1;
                color: var(--txt-1);
                transition: color var(--dur-1) var(--ease);
            }
            .ipt-priority__val[data-disabled="1"] {
                color: var(--txt-4);
            }

            /* ---- 远程只读摘要:一行五张小卡片(MONO/STEREO/lead/pair/freeze),点亮/熄灭 */
            .ipt-remote {
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;
                gap: var(--sp-6);
            }
            .ipt-status {
                display: inline-flex;
                align-items: center;
                gap: var(--sp-3);
                padding: var(--sp-3) var(--sp-7);
                border-radius: var(--r-pill);
                font-family: var(--ff-mono);
                font-size: var(--fs-90);
                letter-spacing: var(--mono-ls-tag);
                line-height: 1;
                white-space: nowrap;
                color: var(--txt-4);
                border: 1px solid rgba(var(--wh), 0.24);
                background: rgba(var(--wh), 0.06);
                transition:
                    background var(--dur-1) var(--ease),
                    color var(--dur-1) var(--ease),
                    border-color var(--dur-1) var(--ease),
                    box-shadow var(--dur-1) var(--ease);
            }
            .ipt-status[data-lit="1"] {
                background: rgba(var(--acc), 0.3);
                border-color: rgba(var(--acc), 0.65);
                color: var(--acc-ink);
                box-shadow: 0 0 8px var(--acc-cta-shadow);
            }
            .ipt-status__num {
                font-size: var(--fs-75);
                line-height: 1;
            }

            .ipt-capture[hidden] {
                display: none;
            }

            /* ---- Footer */
            .ipt-footer {
                flex: none;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--sp-10);
            }
            .ipt-footer__hint {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .ipt-footer__right {
                flex: none;
                display: flex;
                align-items: center;
                gap: var(--sp-8);
            }

            /* ---- 一次性 toast(占用冲突反馈 ch.occupied) */
            .ipt-toast-slot {
                position: absolute;
                right: var(--sp-14);
                bottom: 64px;
            }
            .ipt-toast-slot[hidden] {
                display: none;
            }

            /* ---- 缩放 10 秒防呆确认(复用 Output 同族 .sc-scrim/.sc-modal) */
            .ipt-scale__actions {
                display: flex;
                justify-content: flex-end;
                gap: var(--sp-10);
                margin-top: var(--sp-16);
            }
        </style>
    </head>

                        >v0.0.0</span
                    >
                    <!-- 重看引导([J80]:Input 无设置页,「?」= 唯一重看入口;
                         mini tour 末步 spotlight 高亮的就是本按钮,J62 同款自指)。
                         [SL-272]② 位置由 header 右上改到 footer 末位 = 卡片右下角
                         (header 右上角让给语言胶囊);锚点 data-gb / data-tour 不变。 -->
                    <button
                        type="button"
                        class="sc-btn ipt-help"
                        data-gb="input.header.help"
                        data-tour="help"
                        data-t-aria="tour-in.help"
                    >
                        ?
                    </button>
                </div>
            </footer>

            <!-- 一次性 toast:claim 冲突反馈(ch.occupied) -->
            <div
                class="sc-toast ipt-toast-slot"
                data-gb="input.toast.occupied"
                hidden
            >
                <span class="sc-toast__dot" aria-hidden="true"></span>
                <span
                    data-gb="input.toast.occupied.text"
                    data-t="ch.occupied"
                ></span>
            </div>

            <!-- 缩放 10 秒防呆确认框(05 §1.2;复用 Output 同族 .sc-scrim/.sc-modal) -->
            <div class="sc-scrim" data-gb="input.scale.confirm" hidden>
                <div
                    class="sc-modal"
                    role="alertdialog"
                    aria-modal="true"
                    aria-label="UI Scale"
                >
                    <div
                        class="sc-modal__body"
                        data-gb="input.scale.confirm.body"
                    >
                        <span data-gb="input.scale.confirm.bodyPre"></span>
                        <span
                            class="sc-num"
                            data-gb="input.scale.confirm.countdown"
                            >10</span
                        >
                        <span data-gb="input.scale.confirm.bodyPost"></span>
                    </div>
                    <div class="ipt-scale__actions">
                        <button
                            type="button"
                            class="sc-btn sc-btn--dark"
                            data-gb="input.scale.confirm.revert"
                            data-t="common.cancel"
                        ></button>
                        <button
                            type="button"
                            class="sc-btn sc-btn--cta"
                            data-gb="input.scale.confirm.keep"
                            data-t="scale.keep"
                        ></button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="./app.js"></script>
    </body>
</html>
