<!--
  web/input/index.html —— SCVB Input 单页(T36 正式实现,在 T27b 灰模上替换)。
  真源:masterPlan/plan/05-ui-spec.md §3(Input 全表)/ §1.1(卡片通用骨架)/ §1.2(设计盒)。
  契约:docs/SCVB_CONTRACT.md §3-§4(Input native functions / events)。
  字典:web/shared/i18n.js —— 页内 data-t / data-t-aria 全部引用其现有 key;新增 in.* 词条见 T36。
  锚点纪律:每个节点带 data-gb="<语义 id>"(app.js 消费);视觉零裸 hex,颜色/圆角/阴影一律 tokens.css。
-->
<!doctype html>
<html lang="zh">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>SCVB Input</title>
        <link rel="stylesheet" href="../shared/tokens.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <style>
            /* ---- 本地布局脚手架(05 §0 硬规格允许项):只排布局,零新颜色配方 ---- */
            [hidden] {
                display: none !important;
            }
            html,
            body {
                overflow: hidden;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #ipt-shell {
                position: relative;
                width: var(--ipt-w, 460px);
                height: var(--ipt-h, 560px);
                padding: var(--sp-20);
                display: flex;
                flex-direction: column;
                gap: var(--sp-14);
            }

            /* ---- Header(05 §1.1:品牌块 + 连接状态 pill + 语言胶囊) */
            .ipt-header {
                flex: none;
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: var(--sp-12);
            }
            .ipt-brand {
                display: flex;
                align-items: center;
                gap: var(--sp-10);
                min-width: 0;
            }
            .ipt-brand__logo {
                width: 30px;
                height: 30px;
                mix-blend-mode: multiply;
                border-radius: var(--r-tag);
            }
            .ipt-brand__icon {
                flex: none;
                width: 38px;
                height: 38px;
                border-radius: var(--r-banner);
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                color: var(--txt-1);
            }
            .ipt-brand__text {
                display: flex;
                flex-direction: column;
                gap: var(--sp-2);
                min-width: 0;
            }
            .ipt-brand__title {
                font-family: var(--ff-grotesk);
                font-weight: 600;
                font-size: var(--fs-160);
                color: var(--txt-1);
                white-space: nowrap;
            }
            .ipt-brand__subtitle {
                white-space: nowrap;
            }
            .ipt-header__status {
                flex: none;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: var(--sp-5);
            }
            .ipt-header__pillsub {
                max-width: 200px;
                text-align: right;
            }
            /* 组 badge(J71③:独立「组 {X}」badge,不是 pill 后缀;空/未连接态同样常显) */
            .ipt-group-badge {
                display: inline-flex;
                align-items: center;
                gap: var(--sp-5);
                flex: none;
                padding: var(--sp-4) var(--sp-10);
                border-radius: var(--r-pill);
                background: var(--w-24);
                border: 1px solid rgba(var(--wh), 0.44);
                box-shadow: inset 0 1px 0 rgba(var(--wh), 0.6);
                font-family: var(--ff-mono);
                font-size: var(--fs-100);
                letter-spacing: var(--mono-ls);
                color: var(--txt-1);
                white-space: nowrap;
            }

            /* ---- 警告条区(§3:group.noOutput 引导 + abiMismatch 红横幅) */
            .ipt-banner-zone {
                flex: none;
                display: flex;
                flex-direction: column;
                gap: var(--sp-7);
            }

            /* ---- 内容区(flex column, gap 14,可纵向滚动守 560px 高度) */
            .ipt-content {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: var(--sp-14);
            }
            .ipt-panel {
                flex: none;
                padding: var(--sp-13);
                display: flex;
                flex-direction: column;
                gap: var(--sp-10);
            }

            /* ---- 组选择器(05 §3:压通道网格顶行、比卡片矮一档;胶囊族样式) */
            .ipt-group__head {
                display: flex;
                align-items: center;
                gap: var(--sp-8);
            }
            .ipt-group__pills {
                display: inline-flex;
                flex-wrap: wrap;
                gap: var(--sp-2);
                padding: var(--sp-3);
                border-radius: var(--r-pill);
                background: rgba(var(--wh), 0.14);
                border: 1px solid rgba(var(--wh), 0.28);
            }
            .ipt-group__pill {
                position: relative;
                display: inline-flex;
                align-items: center;
                gap: var(--sp-4);
                padding: var(--sp-4) var(--sp-9);
                border-radius: var(--r-pill);
                cursor: pointer;
                font-family: var(--ff-mono);
                font-size: var(--fs-105);
                font-weight: 500;
                letter-spacing: var(--mono-ls-tag);
                background: transparent;
                border: 0;
                color: var(--txt-3);
                transition: background var(--dur-1) var(--ease);
            }
            .ipt-group__pill[aria-selected="true"] {
                background: var(--seg-on-bg);
                color: var(--acc-ink);
            }
            .ipt-group__pill[data-pending="1"] {
                background: rgba(var(--sem-amber), 0.22);
                color: var(--sem-amber-ink);
            }
            .ipt-group__pill .sc-dot {
                width: 4px;
                height: 4px;
                background: rgb(var(--sem-green));
            }
            .ipt-group__pill[data-online="0"] .sc-dot {
                display: none;
            }
            .ipt-group__warn {
                color: var(--sem-red-ink);
                font-size: var(--fs-90);
                line-height: 1.45;
                text-wrap: pretty;
            }
            .ipt-hr {
                width: auto;
                height: 1px;
                align-self: stretch;
            }

            /* ---- 通道选择器:4×4 紧凑网格(05 §3) */
            .ipt-channels__grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: var(--sp-6);
            }
            .ipt-chcard {
                position: relative;
                min-height: 40px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: var(--sp-2);
                padding: var(--sp-4);
                line-height: 1;
                cursor: pointer;
                border-radius: var(--r-sm);
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                color: var(--txt-2);
                font-family: var(--ff-sans);
            }
            .ipt-chcard[aria-pressed="true"] {
                background: rgba(var(--wh), 0.85);
                color: var(--txt-1);
            }
            .ipt-chcard__num {
                font-family: var(--ff-mono);
                font-size: var(--fs-115);
                font-weight: 500;
                letter-spacing: 0.08em;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            .ipt-chcard__label {
                font-size: var(--fs-80);
                color: var(--txt-4);
                line-height: 1;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .ipt-chcard__label:empty {
                display: none;
            }
            /* 占用文字标(A8 缺件:右上角灰点 + 「占用」文字标) */
            .ipt-chcard__occupied {
                position: absolute;
                top: 3px;
                right: 3px;
                display: inline-flex;
                align-items: center;
                gap: var(--sp-3);
                font-family: var(--ff-mono);
                font-size: var(--fs-75);
                letter-spacing: var(--mono-ls-tag);
                color: var(--sem-gray-ink);
            }
            .ipt-chcard__occupied .sc-dot {
                width: 4px;
                height: 4px;
            }

            /* ---- 本轨 mono/stereo 实测结果(J57,只读) */
            .ipt-source {
                display: flex;
                align-items: center;
                gap: var(--sp-7);
            }
            .ipt-source .sc-badge {
                font-size: var(--fs-90);
                letter-spacing: var(--mono-ls);
            }

            .ipt-manual {
                display: flex;
                align-items: center;
                gap: var(--sp-8);
            }
            .ipt-manual__input {
                width: 52px;
                font-family: var(--ff-mono);
                font-size: var(--fs-105);
                color: var(--txt-2);
                background: rgba(var(--wh), 0.34);
                border: 1px solid rgba(var(--wh), 0.5);
                border-radius: var(--r-micro);
                padding: var(--sp-3) var(--sp-7);
            }

            /* ---- 优先级 stepper */
            .ipt-stepper__btn {
                width: 20px;
                height: 20px;
                border-radius: var(--r-micro);
                border: 1px solid var(--card-border);
                background: rgba(var(--wh), 0.24);
                color: var(--txt-2);
                cursor: pointer;
                font-family: var(--ff-mono);
                line-height: 1;
            }
            .ipt-stepper__btn[data-disabled="1"] {
                opacity: 0.4;
                cursor: not-allowed;
            }

            /* ---- 远程只读摘要 */
            .ipt-remote {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: var(--sp-12);
            }
            .ipt-remote__item {
                display: inline-flex;
                align-items: center;
                gap: var(--sp-5);
            }

            .ipt-capture[hidden] {
                display: none;
            }

            /* ---- Footer */
            .ipt-footer {
                flex: none;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--sp-10);
            }
            .ipt-footer__hint {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .ipt-footer__right {
                flex: none;
                display: flex;
                align-items: center;
                gap: var(--sp-8);
            }

            /* ---- 一次性 toast(占用冲突反馈 ch.occupied) */
            .ipt-toast-slot {
                position: absolute;
                right: var(--sp-14);
                bottom: 64px;
            }
            .ipt-toast-slot[hidden] {
                display: none;
            }

            /* ---- 缩放 10 秒防呆确认(复用 Output 同族 .sc-scrim/.sc-modal) */
            .ipt-scale__actions {
                display: flex;
                justify-content: flex-end;
                gap: var(--sp-10);
                margin-top: var(--sp-16);
            }
        </style>
    </head>
    <body>
        <div id="ipt-shell" class="sc-shell" data-gb="input.shell">
            <span
                class="sc-halo sc-halo--1"
                style="top: -120px; left: -80px"
            ></span>
            <span
                class="sc-halo sc-halo--2"
                style="top: 60px; right: -120px"
            ></span>
            <span
                class="sc-halo sc-halo--3"
                style="bottom: -120px; left: 40px"
            ></span>

            <!-- Header -->
            <header class="ipt-header" data-gb="input.header">
                <div class="ipt-brand">
                    <span
                        class="ipt-brand__icon"
                        data-gb="input.header.icon"
                        aria-hidden="true"
                    >
                        <img
                            class="ipt-brand__logo"
                            src="../shared/logo.png"
                            alt=""
                        />
                    </span>
                    <div class="ipt-brand__text">
                        <div
                            class="ipt-brand__title"
                            data-gb="input.header.title"
                        >
                            SCVB Input
                        </div>
                        <div
                            class="ipt-brand__subtitle sc-eyebrow"
                            data-gb="input.header.subtitle"
                        >
                            SYNCHAIN · VOCAL BALANCER
                        </div>
                    </div>
                </div>
                <div class="ipt-header__status">
                    <!-- 独立「组 {X}」badge(J71③;空/未连接态同样常显) -->
                    <span
                        class="ipt-group-badge"
                        data-gb="input.header.groupBadge"
                    >
                        <span data-t="group.label">组</span>
                        <span data-gb="input.header.groupBadgeLetter">A</span>
                    </span>
                    <div
                        class="sc-pill"
                        data-gb="input.header.pill"
                        data-tone="gray"
                    >
                        <span class="sc-pill__dot"></span>
                        <span
                            data-gb="input.header.pillText"
                            data-t="state.noChannel"
                        ></span>
                    </div>
                    <div
                        class="ipt-header__pillsub sc-hint"
                        data-gb="input.header.pillSub"
                    ></div>
                    <div
                        class="sc-seg sc-seg--sm"
                        data-gb="input.header.lang"
                        role="tablist"
                        data-t-aria="language"
                    >
                        <button
                            type="button"
                            class="sc-seg__item"
                            data-gb="input.header.lang.zh"
                            data-lang="zh"
                            role="tab"
                            aria-selected="true"
                        >
                            中
                        </button>
                        <button
                            type="button"
                            class="sc-seg__item"
                            data-gb="input.header.lang.en"
                            data-lang="en"
                            role="tab"
                            aria-selected="false"
                        >
                            EN
                        </button>
                        <button
                            type="button"
                            class="sc-seg__item"
                            data-gb="input.header.lang.fr"
                            data-lang="fr"
                            role="tab"
                            aria-selected="false"
                        >
                            FR
                        </button>
                    </div>
                </div>
            </header>

            <!-- 警告条区 -->
            <div class="ipt-banner-zone" data-gb="input.bannerZone">
                <!-- group.noOutput 异组引导(amber,信息图标;05 §3) -->
                <div class="sc-banner" data-gb="input.banner.noOutput" hidden>
                    <svg
                        class="sc-banner__icon"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="none"
                        aria-hidden="true"
                    >
                        <circle cx="8" cy="8" r="6.4" stroke-width="1.6" />
                        <line
                            x1="8"
                            y1="7"
                            x2="8"
                            y2="11"
                            stroke-width="1.6"
                            stroke-linecap="round"
                        />
                        <circle cx="8" cy="4.6" r="0.9" fill="currentColor" />
                    </svg>
                    <span data-gb="input.banner.noOutput.text"></span>
                </div>
                <!-- banner.abiMismatch 红横幅(05 §3 / 契约 §4.5;两端 abi 数字可见) -->
                <div
                    class="sc-banner sc-banner--red"
                    data-gb="input.banner.abiMismatch"
                    hidden
                >
                    <svg
                        class="sc-banner__icon"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="none"
                        aria-hidden="true"
                    >
                        <circle cx="8" cy="8" r="6.4" stroke-width="1.6" />
                        <line
                            x1="8"
                            y1="5"
                            x2="8"
                            y2="9"
                            stroke-width="1.6"
                            stroke-linecap="round"
                        />
                        <circle cx="8" cy="11.2" r="0.9" fill="currentColor" />
                    </svg>
                    <span data-gb="input.banner.abiMismatch.text"></span>
                </div>
            </div>

            <!-- 内容区 -->
            <div class="ipt-content" data-gb="input.content">
                <!-- 组选择器 + 通道选择器 -->
                <section
                    class="ipt-panel sc-glass"
                    data-gb="input.channelPanel"
                >
                    <div data-gb="input.group">
                        <div class="ipt-group__head">
                            <span
                                class="sc-eyebrow"
                                data-gb="input.group.label"
                                data-t="group.label"
                            ></span>
                            <div
                                class="ipt-group__pills"
                                data-gb="input.group.pills"
                                role="tablist"
                            ></div>
                        </div>
                        <p
                            class="sc-hint"
                            data-gb="input.group.note"
                            data-t="in.group.note"
                        ></p>
                        <p
                            class="ipt-group__warn"
                            data-gb="input.group.oneOnly"
                            data-t="group.oneOnly"
                        ></p>
                        <div
                            class="sc-confirm"
                            data-gb="input.group.confirm"
                            hidden
                        >
                            <span data-gb="input.group.confirm.text"></span>
                            <button
                                type="button"
                                class="sc-btn"
                                data-gb="input.group.confirm.cancel"
                                data-t="common.cancel"
                            ></button>
                            <button
                                type="button"
                                class="sc-btn sc-btn--cta"
                                data-gb="input.group.confirm.primary"
                                data-t="group.switchConfirm.primary"
                            ></button>
                        </div>
                    </div>

                    <div class="sc-divider ipt-hr" aria-hidden="true"></div>

                    <div data-gb="input.channels">
                        <span
                            class="sc-eyebrow"
                            data-gb="input.channels.eyebrow"
                            data-t="channel"
                        ></span>
                        <div
                            class="ipt-channels__grid"
                            data-gb="input.channels.grid"
                        ></div>
                        <p
                            class="sc-hint"
                            data-gb="input.channels.emptyHint"
                            data-t="in.channels.emptyHint"
                        ></p>
                        <p
                            class="sc-hint"
                            data-gb="input.channels.groupEmptyHint"
                            data-t="in.chHint.groupEmpty"
                            hidden
                        ></p>
                        <!-- 本轨 mono/stereo 实测结果(J57,只读) -->
                        <div class="ipt-source" data-gb="input.source" hidden>
                            <span class="sc-badge" data-gb="input.source.badge"
                                >ST</span
                            >
                            <span
                                class="sc-hint"
                                data-gb="input.source.hint"
                                data-t="in.pillSub.stereo"
                            ></span>
                        </div>
                        <!-- 释放确认条(点未分配卡/再点当前卡触发) -->
                        <div
                            class="sc-confirm"
                            data-gb="input.channels.releaseConfirm"
                            hidden
                        >
                            <span
                                data-gb="input.channels.releaseConfirm.text"
                                data-t="in.releaseConfirm"
                            ></span>
                            <button
                                type="button"
                                class="sc-btn"
                                data-gb="input.channels.releaseConfirm.cancel"
                                data-t="common.cancel"
                            ></button>
                            <button
                                type="button"
                                class="sc-btn sc-btn--cta"
                                data-gb="input.channels.releaseConfirm.primary"
                                data-t="in.releaseConfirm.primary"
                            ></button>
                        </div>
                        <!-- 手动输入兜底(0-15,清空/输入 0 = 释放) -->
                        <div class="ipt-manual" data-gb="input.channels.manual">
                            <input
                                type="number"
                                min="0"
                                max="15"
                                class="ipt-manual__input"
                                data-gb="input.channels.manual.input"
                                data-t-aria="channel"
                            />
                            <button
                                type="button"
                                class="sc-btn"
                                data-gb="input.channels.manual.confirm"
                                data-t="in.channels.manual.confirm"
                            ></button>
                        </div>
                    </div>
                </section>

                <!-- 优先级(远程视图) -->
                <section class="ipt-panel sc-glass" data-gb="input.priority">
                    <span
                        class="sc-eyebrow"
                        data-gb="input.priority.eyebrow"
                        data-t="priority"
                    ></span>
                    <div
                        class="sc-stepper"
                        data-gb="input.priority.stepper"
                        data-t-aria="priority"
                    >
                        <button
                            type="button"
                            class="ipt-stepper__btn"
                            data-gb="input.priority.stepper.dec"
                            aria-label="−"
                        >
                            −
                        </button>
                        <span
                            class="sc-stepper__val"
                            data-gb="input.priority.stepper.val"
                            >0</span
                        >
                        <button
                            type="button"
                            class="ipt-stepper__btn"
                            data-gb="input.priority.stepper.inc"
                            aria-label="+"
                        >
                            +
                        </button>
                    </div>
                    <p
                        class="sc-hint"
                        data-gb="input.priority.note"
                        data-t="in.priority.note"
                    ></p>
                </section>

                <!-- 远程只读摘要(lead/pair/冻结) -->
                <section
                    class="ipt-panel ipt-remote sc-glass"
                    data-gb="input.remoteSummary"
                    hidden
                >
                    <span
                        class="ipt-remote__item"
                        data-gb="input.remoteSummary.lead"
                        hidden
                    >
                        <span class="sc-badge" data-t="leadLock"></span>
                    </span>
                    <span
                        class="ipt-remote__item"
                        data-gb="input.remoteSummary.pair"
                        hidden
                    >
                        <span class="sc-badge" data-t="pair"></span>
                        <span
                            class="sc-badge sc-mono"
                            data-gb="input.remoteSummary.pairId"
                        ></span>
                    </span>
                    <span
                        class="ipt-remote__item"
                        data-gb="input.remoteSummary.freeze"
                        hidden
                    >
                        <span
                            class="sc-badge"
                            data-gb="input.remoteSummary.freezeText"
                        ></span>
                    </span>
                </section>

                <!-- 采集指示(小绿点,非采集隐藏) -->
                <div
                    class="sc-pill ipt-capture"
                    data-gb="input.captureIndicator"
                    data-tone="green"
                    hidden
                >
                    <span class="sc-pill__dot" data-pulse="1"></span>
                    <span data-t="capturing"></span>
                </div>
            </div>

            <!-- Footer -->
            <footer class="ipt-footer" data-gb="input.footer">
                <span
                    class="ipt-footer__hint sc-hint"
                    data-gb="input.footer.hint"
                    data-t="in.footer.hint"
                ></span>
                <div class="ipt-footer__right">
                    <select
                        class="sc-select"
                        data-gb="input.footer.scale"
                        data-t-aria="scale"
                    ></select>
                    <span
                        class="ipt-footer__version sc-mono"
                        data-gb="input.footer.version"
                        >v0.0.0</span
                    >
                </div>
            </footer>

            <!-- 一次性 toast:claim 冲突反馈(ch.occupied) -->
            <div
                class="sc-toast ipt-toast-slot"
                data-gb="input.toast.occupied"
                hidden
            >
                <span class="sc-toast__dot" aria-hidden="true"></span>
                <span
                    data-gb="input.toast.occupied.text"
                    data-t="ch.occupied"
                ></span>
            </div>

            <!-- 缩放 10 秒防呆确认框(05 §1.2;复用 Output 同族 .sc-scrim/.sc-modal) -->
            <div class="sc-scrim" data-gb="input.scale.confirm" hidden>
                <div
                    class="sc-modal"
                    role="alertdialog"
                    aria-modal="true"
                    aria-label="UI Scale"
                >
                    <div
                        class="sc-modal__body"
                        data-gb="input.scale.confirm.body"
                    >
                        <span data-gb="input.scale.confirm.bodyPre"></span>
                        <span
                            class="sc-num"
                            data-gb="input.scale.confirm.countdown"
                            >10</span
                        >
                        <span data-gb="input.scale.confirm.bodyPost"></span>
                    </div>
                    <div class="ipt-scale__actions">
                        <button
                            type="button"
                            class="sc-btn sc-btn--dark"
                            data-gb="input.scale.confirm.revert"
                            data-t="common.cancel"
                        ></button>
                        <button
                            type="button"
                            class="sc-btn sc-btn--cta"
                            data-gb="input.scale.confirm.keep"
                            data-t="scale.keep"
                        ></button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="./app.js"></script>
    </body>
</html>
