<!--
  web/monitor/index.html —— SCVB Monitor 页面。

  ⚠ **本页是 T45 的最小占位页,不是设计实现。** 真 UI(上 = 声像/音量分布图,下 = 轨迹图占主体,
  顶部组选择 A-H)归 **T46**,真源 = masterPlan/plan/05-ui-spec.md 文末「J75 增补规格」节 C。

  T46 接手时约定(T45 已留好):
    - 资源目录 = 本目录 `web/monitor/`(index.html + app.js;与 web/input、web/output 同构)。
    - 复用 `../shared/` 的 tokens.css / base.css / i18n.js / track-colors.js / trajectory-chart.js
      (T43 已把轨迹图组件与 15 色轨道调色板落进 web/shared/,零重复实现)。
    - 词条走 `monitor.*` 组三语,入 web/shared/i18n.js —— **本占位页刻意不带任何 data-t**,
      免得 check-i18n 校验一批 T46 才会定稿的 key。
    - 设计盒尺寸依内容定(缩放机制同款:设计盒 + CSS zoom + setSize 同步 + 10 秒防呆);
      T45 壳层暂借 Output 盒(1180×780,7 档),native 侧 role="monitor" 已回落该档位表。
    - 桥面:函数 setGroupId(1..8);事件 scvb.state / scvb.groups / scvb.viz(见 src/monitor/MonitorBridgeApi.h)。

  本页存在的意义只有一个:**证明 Output → viz 段 → Monitor → web 整条链路通**。
-->
<!doctype html>
<html lang="zh">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>SCVB Monitor</title>
        <link rel="stylesheet" href="../shared/tokens.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <style>
            .mon-shell {
                display: flex;
                flex-direction: column;
                gap: 12px;
                padding: 16px;
            }
            .mon-row {
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            .mon-groups {
                display: flex;
                gap: 6px;
            }
            .mon-group {
                min-width: 32px;
                padding: 4px 8px;
                cursor: pointer;
            }
            .mon-group[aria-pressed="true"] {
                outline: 2px solid currentColor;
            }
            .mon-tracks {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 4px;
            }
            .mon-track {
                display: flex;
                align-items: center;
                gap: 6px;
                font: 12px/1.4 monospace;
            }
            .mon-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                flex: none;
            }
            .mon-track[data-covered="false"] {
                opacity: 0.4;
            }
        </style>
    </head>
    <body>
        <main class="mon-shell" data-gb="monitor.shell">
            <h1 data-gb="monitor.title">SCVB Monitor</h1>

            <div class="mon-row" data-gb="monitor.groupbar">
                <span>Group</span>
                <div
                    class="mon-groups"
                    role="group"
                    aria-label="Group selection"
                    data-gb="monitor.groups"
                ></div>
            </div>

            <div class="mon-row" data-gb="monitor.status">
                <span data-gb="monitor.viz-state">viz: —</span>
                <span data-gb="monitor.window">window: —</span>
                <span data-gb="monitor.playhead">playhead: —</span>
            </div>

            <div class="mon-tracks" data-gb="monitor.tracks"></div>

            <p data-gb="monitor.placeholder-note">
                T45 shell — charts land in T46 (05 §J75-C).
            </p>
        </main>
        <script type="module" src="./app.js"></script>
    </body>
</html>
