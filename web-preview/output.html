<!--
  web-preview/output.html —— Output 侧**薄壳页**(T28)。

  它自己**没有任何 UI**:画面 100% 来自真源 web/output/index.html(经同源 iframe 引用),
  壳页只干两件事 —— ①把 web-preview 的 mock 后端注入 iframe 的 window.__SCVB_MOCK__,
  ②在顶部挂一条预览工具条(返回导航 / 重载 / 注入状态)。
  注入机制、时序假设与失败回退全部写在 web-preview/shell.js 的文件头,README 有摘要。

  06 §6.2 硬约束 1:web/ 是唯一真源,本文件里**没有一行复制来的 UI 代码**。

  URL 参数(由 mock/state-driver.js 解析,壳页只透传 location.search):
    ?fixture=empty|fifteen-tracks|misaligned|channel-conflict|second-output|stereo-mixed
    ?scenario=<05 §2.5 场景名>   —— 兼容口径,未接线的场景回落 fifteen-tracks 并 warn
    &loop=none                   —— 宿主不提供循环区:setRange("daw_loop") 回 {ok:false,reason:"noLoop"}

  必须经 serve.ps1(http://127.0.0.1)打开;file:// 下 iframe 变跨源,注入不成立。
-->
<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SCVB Output · web-preview</title>
    </head>
    <body>
        <header class="pv-bar">
            <a href="./index.html">← 预览导航</a>
            <strong>SCVB Output</strong>
            <span class="pv-meta"></span>
            <span class="pv-status" data-ok="wait" role="status">初始化…</span>
            <span class="pv-warn"></span>
            <button type="button" class="pv-reload">重载</button>
        </header>
        <!-- iframe 由 shell.js 建并按 design-box.js 的设计盒给最小尺寸,故此处只留舞台容器 -->
        <main class="pv-stage"></main>
        <script type="module">
            import { mountPreview } from "./shell.js";
            mountPreview({ role: "output" });
        </script>
    </body>
</html>
