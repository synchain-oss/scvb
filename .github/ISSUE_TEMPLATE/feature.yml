name: 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["type/feat"]
body:
  - type: checkboxes
    id: frozen-contract
    attributes:
      label: "★ 冻结契约自查"
      options:
        - label: "我理解 SCVB 的 123 个自动化参数已冻结(宿主可见 124,含 bypass),本建议不要求新增自动化参数(见 ADR-004 / docs/PARAMETERS.md)"
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: 问题场景
      description: 你现在想做什么,为什么做不到
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案(可选)
