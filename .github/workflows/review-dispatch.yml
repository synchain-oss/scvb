name: Review Dispatch

# 维护者在 PR 上评论 `/review` → 显式触发一次 AI 审查(12 §6.2 方案 D)。
# 这是 fork PR 唯一的 AI 审查通道:claude-review.yml 的 same-repo 条件(J31)让 fork PR 不跑 bot,
# 而 [J20] 永久禁用向 fork PR 供密的事件触发,所以只能由维护者显式发起。
#
# [SL-517] 本 job 带着 secrets 跑,所以全程不签出 PR 的代码:工作区是 PR 的目标分支(本仓分支,
# 只有维护者能写),PR 的改动只以文本交给模型当数据读(由 workflow 预先写进 `.ot-review/`,模型没有 shell)。
# 注意:issue_comment 事件用的永远是默认分支上的这份文件,改这里要合到默认分支才生效。
on:
  issue_comment:
    types: [created]

# 只有「会真的跑审查」的评论共用一个组;其它评论(bot 回帖、普通讨论)每条各占一个组。
# 若所有评论共用一个组,审查跑着的时候 PR 上任何一条新评论都会把它取消 ——
# 被 if 跳过的 run 一样占组、一样触发 cancel-in-progress。
concurrency:
  group: review-dispatch-${{ github.event.issue.number }}-${{ (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && 'review' || github.event.comment.id }}
  cancel-in-progress: true

permissions:
  contents: read # 仅够 checkout 目标分支
  pull-requests: write # inline comment
  issues: write # gh pr comment 走 issue comments 接口;与 claude-review.yml 同配
  # 其余一律 none —— 不给 actions/packages/id-token

jobs:
  dispatch:
    # 三条 if 逐字(缺任何一条都会把这条通道变成任意外部用户可触发的供密面):
    #   1. 必须是 PR 上的评论(issue_comment 同样在普通 issue 上触发)
    #   2. 评论必须以 /review 开头(startsWith,不用 contains —— contains 会被正文里引用该字符串的评论误触)
    #   3. 评论者必须是维护者身份:OWNER / MEMBER / COLLABORATOR
    #      **显式排除 CONTRIBUTOR** —— 它表示「曾有提交被合入」,fork PR 的作者第二次提 PR 时就是 CONTRIBUTOR,
    #      放行等于把这条通道交给外部人自助触发
    # 上面 concurrency 的组名里抄了同一组条件,改这里要一起改。
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest # V-4 确认前一律 latest(§4.2 口径注)
    timeout-minutes: 20
    steps:
      # 回帖的 id 留给后面「核对有没有发出审查总结」那一步:只数这条之后的评论。
      - name: Ack
        id: ack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="已收到 /review,开始审查。" -q .id)
          case "$id" in '' | *[!0-9]*) echo "::error::unexpected ack comment id: '$id'"; exit 1 ;; esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # PR 的 diff 一旦触及 .github/workflows/,立即中止,改由维护者本地人工审。
      # 本 job 不签出 PR 代码,PR 里改过的 workflow 在这里不会被执行;这一步是纵深防御:
      # 改 workflow 的 PR 不该只凭一次 AI 审查放行。
      # 回帖成功后留一个标记文件,末尾的「失败回帖」见到它就不再重复回一条。
      - name: Assert PR does not touch workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "$files"
          if echo "$files" | grep -qE '^\.github/workflows/'; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "该 PR 修改了 .github/workflows/,按安全策略不能通过 /review 审查;请维护者本地拉分支人工审。" &&
              touch "$RUNNER_TEMP/review-dispatch-reported"
            exit 1
          fi

      # 取 PR 的目标分支名,下一步签出它(不是 PR head)。baseRefName 一定是本仓的分支。
      - name: Resolve PR base branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          [ -n "$base" ] || { echo "::error::cannot resolve base branch of PR #$PR"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 1
          persist-credentials: false

      # 模型没有 shell(工具边界见 claude-review.yml 的 claude_args):PR 的 diff 与元数据由这一步预先写成文件,
      # 模型只用 Read/Grep/Glob 读。必须排在 checkout 之后(checkout 会清掉工作区里未跟踪的文件)。
      # PR 编号与仓库名经 env 传入;标题、正文等不可信文本只经 gh 写进文件,不进入任何 shell 展开。
      # 本步的 run 脚本与 claude-review.yml、deepseek-review.yml 的同名步骤逐字相同(只有 PR_NUMBER 的来源不同),
      # 改一处要三处一起改。其中的符号链接防护(理由与前提见 claude-review.yml 同名步骤上方的注释)在这里查的是
      # 签出的目标分支的 git 索引:这条通道不签出 PR 代码,PR 自带的符号链接不会落到磁盘上,只以文本出现在 pr.diff 里;
      # 保留它是为了三份逐字一致,也防目标分支本身混进符号链接。判红后由末尾的「失败回帖」告知 PR。
      - name: Prepare PR context for the reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # 符号链接防护(理由与前提见本步上方注释):按 git 索引判断,不看工作树。
          links=$(git ls-files -s | awk -F'\t' '$1 ~ /^120000 / {print $2}')
          if [ -n "$links" ]; then
            echo "::error::the checked-out tree tracks symbolic links; AI review skipped by policy:"
            printf '%s\n' "$links"
            echo "签出的代码里有被 git 跟踪的符号链接(该 PR 或其目标分支引入),按安全策略不做 AI 审查,请维护者本地人工审。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # 先删再建:签出的代码若自带 .ot-review/,其中的符号链接会让 > 顺着链接写到工作区外。
          rm -rf .ot-review
          mkdir .ot-review
          # gh pr diff 任何失败(最常见的是 diff 超过 20,000 行时接口返回 406)都降级为逐文件 patch(大文件的 patch 可能被省略),
          # 并留下 DIFF_PARTIAL 标记,让 bot 在总结里写明 diff 不完整,而不是让 job 直接失败。
          if ! gh pr diff "$PR_NUMBER" -R "$REPO" > .ot-review/pr.diff; then
            echo "full diff unavailable; per-file patches only" > .ot-review/DIFF_PARTIAL
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | "diff --git a/\(.filename) b/\(.filename)\n# status: \(.status), +\(.additions) -\(.deletions)\n\(.patch // "# (patch omitted by GitHub: file too large or binary)")"' \
              > .ot-review/pr.diff
          fi
          gh pr view "$PR_NUMBER" -R "$REPO" --json number,title,body,baseRefName,headRefName,headRefOid,commits,files > .ot-review/pr.json
          wc -c .ot-review/*

      # prompt 与 claude_args(--model / --tools / --allowedTools / --disallowedTools)的唯一真源是 claude-review.yml:
      # 这里从刚签出的目标分支上那份文件里原样取出,不另抄一份。
      # 取不到、或取到的内容缺下面任何一项断言,一律判红,不带着残缺的 prompt 去跑。
      # 工具边界的三项断言(有 --tools 白名单、有 --disallowedTools 黑名单、没有任何 Bash(...) 放行规则)也在这里:
      # 目标分支上的 claude-review.yml 若还是加固前的版本,宁可判红也不带着能跑 shell 的配置去读 PR。
      - name: Load prompt and claude_args from claude-review.yml
        id: cfg
        env:
          PR: ${{ github.event.issue.number }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          src=.github/workflows/claude-review.yml
          command -v yq >/dev/null || { echo "::error::yq not found on runner"; exit 1; }
          sel='.jobs["claude-pr-review"].steps[] | select(.uses != null and (.uses | test("^anthropics/claude-code-action@")))'
          n=$(yq "[${sel}] | length" "$src")
          [ "$n" = "1" ] || { echo "::error::expected exactly 1 claude-code-action step in $src, got $n"; exit 1; }
          prompt=$(yq "${sel} | .with.prompt" "$src")
          args=$(yq "${sel} | .with.claude_args" "$src")
          # claude-review.yml 的 prompt 里只有 REPO 与 PR NUMBER 两处表达式,换成本次的值。
          # 表达式的开头三个字符拼出来写:原样写进 run 块会被 Actions 当成表达式先求值掉。
          o='$''{{'
          prompt=${prompt//"$o github.repository }}"/$GITHUB_REPOSITORY}
          prompt=${prompt//"$o github.event.pull_request.number }}"/$PR}
          fail=0
          case "$prompt" in *"$o"*) echo "::error::unresolved expression left in prompt"; fail=1 ;; esac
          case "$prompt" in *"PR NUMBER: $PR"*) ;; *) echo "::error::prompt lacks 'PR NUMBER: $PR'"; fail=1 ;; esac
          case "$prompt" in *'不可信数据声明'*) ;; *) echo "::error::prompt lacks the untrusted-data section"; fail=1 ;; esac
          case "$args" in *'--model '*) ;; *) echo "::error::claude_args lacks --model"; fail=1 ;; esac
          case "$args" in *'--allowedTools '*) ;; *) echo "::error::claude_args lacks --allowedTools"; fail=1 ;; esac
          case "$args" in *'--tools '*) ;; *) echo "::error::claude_args lacks --tools (built-in tool whitelist)"; fail=1 ;; esac
          case "$args" in *'--disallowedTools '*) ;; *) echo "::error::claude_args lacks --disallowedTools"; fail=1 ;; esac
          case "$args" in *'Bash('*) echo "::error::claude_args grants a Bash(...) rule; this channel must run without a shell"; fail=1 ;; esac
          [ "$fail" = 0 ] || exit 1
          pre="## 本次运行的前提(维护者 /review 手动触发)
          工作区签出的是 PR 的目标分支 ${BASE},不是 PR 的代码 —— 这条通道出于安全考虑不签出 PR 代码。
          PR 的改动一律读 \`.ot-review/pr.diff\`(标题、正文等在 \`.ot-review/pr.json\`,都由 workflow 预先写好);你没有 shell。
          Read / Glob / Grep 读到的是目标分支上的文件(契约文档、改动前的上下文),不要把工作区里的文件当成 PR 改动后的样子;
          下面常规说明里「工作区是 PR head 分支上的代码」与「被省略的文件直接读工作区里的版本」两句本次不成立。
          inline comment 的行号以 \`.ot-review/pr.diff\` 里改动后那一侧的行号为准;Read 读到的是改动前的文件,行号对不上。
          本次没有进度评论,你也没有发评论的工具:你的最终回复会由 workflow 原样发到 PR 上作为审查总结,
          所以完整的审查总结(含最后的结论)必须写在最终回复里。
          下面是常规审查说明。"
          d="EOF_$(openssl rand -hex 16)"
          {
            echo "prompt<<$d"; printf '%s\n\n%s\n' "$pre" "$prompt"; echo "$d"
            echo "args<<$d"; printf '%s\n' "$args"; echo "$d"
          } >> "$GITHUB_OUTPUT"
          echo "claude_args:"; printf '%s\n' "$args"

      # 不开 track_progress:在 issue_comment 上它会把 action 切到 tag 模式,
      # 而 tag 模式会自己 fetch 并签出 PR head,还会追加改文件与 git commit/push 的工具,正是这里要避开的。
      # 给了 prompt 就是 agent 模式(action 的 src/modes/detector.ts):不切分支。但 agent 模式下 --allowedTools
      # 同样只是「免确认」的放行规则、不是工具白名单(src/modes/agent/index.ts 把 claude_args 原样交给
      # base-action/src/parse-sdk-options.ts,后者只把它填进 SDK 的 allowedTools),而且 agent 模式同样会把
      # GITHUB_TOKEN 写进 origin 的 remote URL(src/github/operations/git-config.ts 的 configureGitAuth,
      # persist-credentials: false 管不到)—— 所以工具边界靠上一步一起取来的 --tools 白名单 + --disallowedTools 黑名单,
      # 与 claude-review 同一套;模型没有 shell,也就没有 `gh pr comment` 这条写出口,总结由下一步代发。
      # base_branch:agent 模式下 action 从这个分支恢复 .claude/、CLAUDE.md 等配置路径,不传就取默认分支,
      # 会和上面签出的目标分支对不上(CLAUDE.md 是 prompt 要求先读的文件之一)。
      # 这一步自己的超时比 job 的 20 分钟短:超时按这一步失败处理,job 还剩时间跑末尾的失败回帖。
      - uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # main, Claude Code 2.1.280
        id: review
        timeout-minutes: 17
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: ${{ steps.pr.outputs.base }}
          prompt: ${{ steps.cfg.outputs.prompt }}
          claude_args: ${{ steps.cfg.outputs.args }}

      # 模型没有 shell,也没有发顶层评论的工具(agent 模式只在 allowedTools 点名时才装评论 MCP,而那个工具只能
      # 改 tag 模式建的追踪评论):它的最终回复就是审查总结,由这一步从 execution_file 里取出、原样发到 PR 上。
      # 发出去的是模型写的文字,所以先过一道纵深防御:出现凭据形态的字符串就不发、判红,走末尾的失败回帖。
      # 模型本应读不到任何凭据(见 claude-review.yml 的 deny 规则),真出现了说明边界被突破,不能贴到 PR 上。
      # 这道过滤只管这一步代发的总结,不覆盖 inline comment:行内评论由模型经 inline comment 工具直接发出,不经过这里。
      # 总结超过 GitHub 评论上限(65536 字符)时截断并在末尾附 run 链接,完整总结写进本次 run 的摘要页;
      # 不截断的话 gh pr comment 会被接口拒掉,PR 上只剩一句笼统的失败回帖,看不出原因。
      - name: Post the review summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ] || { echo "::error::review step left no execution file"; exit 1; }
          body="$RUNNER_TEMP/review-summary.md"
          jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXEC_FILE" > "$body"
          grep -q '[^[:space:]]' "$body" || { echo "::error::the review finished without a final summary"; exit 1; }
          # GitHub token(含 GITHUB_TOKEN 的 ghs_)/ fine-grained PAT / sk- 开头的 key(Anthropic OAuth 与 API key、
          # DeepSeek key;前面要求非字母数字,免得 task-… 这类连字符标识符误报)/ JWT。
          if grep -qE 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|(^|[^A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ' "$body"; then
            echo "::error::the review summary contains a credential-shaped string; not posting it"
            exit 1
          fi
          # 上限按字符计(jq 的 length 数的是码点,不是字节);超限时截到 60000 字符,给末尾的说明留足余量。
          # 凭据过滤在上面对全文做过,截断与写摘要页都在它之后。
          if [ "$(jq -Rs 'length' "$body")" -gt 65536 ]; then
            echo "::warning::the review summary exceeds the 65536-character comment limit; posting a truncated copy"
            cat "$body" >> "$GITHUB_STEP_SUMMARY"
            jq -Rrs --arg url "$RUN_URL" \
              '.[0:60000] + "\n\n---\n\n(审查总结超过 GitHub 评论上限 65536 字符,以上为截断后的前一部分;完整总结见本次运行的摘要页:" + $url + ")"' \
              "$body" > "$body.cut"
            mv "$body.cut" "$body"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      # 没有进度评论,模型的最终输出不会自动出现在 PR 上,由上一步代发;上一步没发出总结时,
      # PR 上只剩 Ack 那一句,看起来和「审过、没问题」一样。这里再核一次:Ack 之后
      # 至少要有一条 github-actions[bot] 的 issue 评论,且不是本 workflow 的固定回帖。
      # 只防「一条总结都没发」:同一时间窗里别的 workflow 也以这个身份发了评论时,这一步会放行。
      - name: Assert a review summary was posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          ACK_ID: ${{ steps.ack.outputs.id }}
        run: |
          case "$ACK_ID" in '' | *[!0-9]*) echo "::error::missing ack comment id: '$ACK_ID'"; exit 1 ;; esac
          q='.[] | select(.user.login == "github-actions[bot]" and .id > '"$ACK_ID"')'
          q="$q"' | select((.body | startswith("已收到 /review")) or (.body | startswith("/review 未完成")) | not) | .id'
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q "$q")
          [ -n "$ids" ] || { echo "::error::review finished without posting a summary comment on PR #$PR"; exit 1; }
          echo "summary comment id(s):"; echo "$ids"

      # 任何一步红了(含上面审查那一步超时)或 job 被取消(包括被新的 /review 顶掉),PR 上都要有下文 ——
      # 否则 Ack 之后再无动静,与「审过、没问题」无从区分。
      # 「PR 改了 workflows」那一步回过帖时会留标记文件,这里见到就不再重复。
      - name: Report failure on the PR
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ ! -e "$RUNNER_TEMP/review-dispatch-reported" ] || exit 0
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "/review 未完成:本次审查失败、超时或被取消(例如又发了一次 /review),PR 上没有审查结论不代表没有问题。日志:$RUN_URL"
