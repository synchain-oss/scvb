name: Review Dispatch

# 维护者在 PR 上评论 `/review` → 显式触发一次 AI 审查(12 §6.2 方案 D)。
# 这是 fork PR 唯一的 AI 审查通道:claude-review.yml 的 same-repo 条件(J31)让 fork PR 不跑 bot,
# 而 [J20] 永久禁用向 fork PR 供密的事件触发,所以只能由维护者显式发起。
on:
  issue_comment:
    types: [created]

concurrency:
  group: review-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read # 仅够 checkout
  pull-requests: write # 回帖审查结论
  # 其余一律 none —— 不给 actions/packages/id-token

jobs:
  dispatch:
    # 三条 if 逐字(缺任何一条都会把这条通道变成任意外部用户可触发的供密面):
    #   1. 必须是 PR 上的评论(issue_comment 同样在普通 issue 上触发)
    #   2. 评论必须以 /review 开头(startsWith,不用 contains —— contains 会被正文里引用该字符串的评论误触)
    #   3. 评论者必须是维护者身份:OWNER / MEMBER / COLLABORATOR
    #      **显式排除 CONTRIBUTOR** —— 它表示「曾有提交被合入」,fork PR 的作者第二次提 PR 时就是 CONTRIBUTOR,
    #      放行等于把这条通道交给外部人自助触发
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest # V-4 确认前一律 latest(§4.2 口径注)
    timeout-minutes: 20
    steps:
      - name: Ack
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh pr comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "已收到 /review,开始审查。"

      # 先 checkout 基仓的 workflow 定义(不是 PR 代码)——后续步骤用的是这一份
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x.y —— 必须 pin SHA(§8.4)
        with: { persist-credentials: false }

      # 供密前的硬断言:PR 的 diff 一旦触及 .github/workflows/,立即中止。
      # 没有这一步,外部 PR 可以改掉 workflow 本身,在维护者敲 /review 的那一刻拿到 secrets。
      - name: Assert PR does not touch workflows
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          files=$(gh pr diff "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "$files"
          if echo "$files" | grep -qE '^\.github/workflows/'; then
            gh pr comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
              --body "该 PR 修改了 .github/workflows/,按安全策略不能通过 /review 审查;请维护者本地拉分支人工审。"
            exit 1
          fi

      - name: Checkout PR head
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh pr checkout "${{ github.event.issue.number }}"

      # prompt 与 allowedTools 与 §3.4 claude-review.yml 完全共用同一份(唯一真源 = §3.4),
      # 末尾必带 §3.4 的「不可信数据声明」防注入结尾(§8.4 第五条)。
      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # prompt / allowedTools:逐字取 §3.4
