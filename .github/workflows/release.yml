name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  release:
    # [SL-307] **刻意禁用**,让下面那句「T01 只落 release 骨架并保持 disable」成为真话 ——
    # 在此之前它只是注释里那么写,而 `on.push.tags: ["v*"]` 是 armed 的:推一个 v* tag 会真的
    # 把这个 job 跑起来,并在 `Package` 步撞上**本仓不存在**的 `scripts/package.ps1`(T40 交付物)。
    # 用 `if: false` 而不是摘掉 `on.push.tags`:两条触发路径(tag push 与手动 dispatch)要**一起**
    # 禁掉才对得上「disable」;只摘 tags 的话手动 dispatch 仍会跑进那个不存在的脚本。触发面原样
    # 留着,当作「T40 之后该长什么样」的记录。
    # **解除条件:T40 交付 `scripts/package.ps1` 时删掉本行 `if: false`。**
    if: false
    runs-on: windows-2022
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      # 复用 build-vst3 的全部构建步骤(建议抽成 composite action .github/actions/build-scvb)。
      # T01 只落 release 骨架并保持 disable;完整 build/ctest/pluginval 复用与 scripts/package.ps1
      # 由 T40 补齐(06 §3.8 六条硬要求 / 07 T40)。
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $projLine = (Select-String -Path CMakeLists.txt -Pattern 'VERSION' | Select-Object -First 1).Line
          $v = (($projLine -split 'VERSION')[1]).Trim().TrimEnd(')')
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($v -ne $tag) { Write-Error "CMake VERSION=$v != tag $tag"; exit 1 }
      - name: Package
        shell: pwsh
        run: pwsh scripts/package.ps1 -Version "${{ github.ref_name }}".TrimStart('v') -BuildDir build -OutDir dist
      - name: Publish job summary (供 Release note 与官网常量直接复制)
        shell: pwsh
        run: Get-Content dist/package-summary.md | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.x.y —— 必须 pin SHA
        with:
          draft: true # 人工确认 release notes 后再发布
          files: |
            dist/SCVB-v*-win64.zip
            dist/SCVB-v*-win64.zip.sha256
