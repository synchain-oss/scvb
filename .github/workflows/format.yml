name: Format

on:
  pull_request:
    # 2026-08-19 用户指令:feature/** 子 PR 同样跑 format(CI 覆盖全部并入 dev 的 PR)。
    branches: [dev, "feature/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, "feature/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format # required check context
    runs-on: ubuntu-latest # [R3] V-4 确认前一律 latest(§3.0 口径注)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned clang-format
        # 用 pip 版而非 apt 版:apt 的版本随 runner 镜像漂移,同一份代码在本地/CI 会格式化出不同结果。
        # 版本号必须与 scripts/gates.ps1 和 .clang-format 头注释里写的一致。
        run: pipx install clang-format==18.1.8
      - name: Check formatting
        run: |
          files=$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | grep -v '^third_party/')
          test -n "$files" || { echo "::error::no C++ sources found"; exit 1; }
          clang-format --dry-run --Werror --style=file $files
      - name: Check web assets formatting (prettier)
        # 与 scripts/gates.ps1 gate 3 **逐字相同**的一条命令;范围收敛全部交给 .prettierignore
        run: npx --yes prettier@3 --check .

  web-smoke:
    name: web-smoke # required check context
    runs-on: ubuntu-latest # [R3] V-4 确认前一律 latest(§3.0 口径注)
    # 与 clang-format **平行**而非塞进同一 job:纯 web 的 PR 不该被 C++ 门禁的
    # 排队时间挡住;反过来 C++ 的 PR 也该照跑这套 —— web/ 是被 C++ 侧 WebView
    # 加载的真源。与 scripts/gates.ps1 的 Gate 3e 同口径。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 测试用到 node 内建 fetch 与全局 WebSocket;与 web-preview/README
          # 的「node ≥ 22」口径一致。
          node-version: "22"
      - name: Run web smokes
        # web-preview/tests/*.mjs 是 UI 侧**唯一**的行为门禁(纯函数 + mock 端到
        # 端 + 源码级纪律断言),T31–T36 六张卡的回归保护全压在上面。接入前没有
        # 任何 workflow 跑它们 —— 纯 web 的 PR 即使把八套全跑红,CI 也是全绿的。
        # 零依赖:不装 npm 包,直接 node 跑;每套退出码 0 = 全绿,非 0 逐条打印
        # [FAIL]。不用 `|| exit 1` 提前退出,好让一次 CI 就看全所有红项。
        run: |
          shopt -s nullglob
          files=(web-preview/tests/smoke-*.mjs)
          test ${#files[@]} -gt 0 || { echo "::error::no web smokes found"; exit 1; }
          fail=0
          for f in "${files[@]}"; do
            echo "--- $f"
            node "$f" || { echo "::error file=$f::web smoke failed"; fail=1; }
          done
          exit $fail

  docs-truth:
    name: docs-truth # required check context
    runs-on: ubuntu-latest # [R3] V-4 确认前一律 latest(§3.0 口径注)
    # 九条硬约束红字的唯一真源 = docs/USER_GUIDE.zh-CN.md 的 `## 硬约束` 小节,它要落到
    # markdown ×4 + i18n ×3 共 7 处(12 §3.4)。手抄必漂,而条目数 == 9 / grep「六条」/
    # check-i18n 的 key 全等这三道既有机检只查得出数量与标题,查不出条目**文本**漂移 ——
    # 逐字节比对生成物是唯一查得出的那道,所以它必须在 CI 里,不能只靠本地 gates。
    # 无 secrets ⇒ fork PR 也跑得动。与 scripts/gates.ps1 的 Gate 3f 同口径。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Hard rules generator (--check)
        run: node scripts/gen-hard-rules.mjs --check
      - name: i18n dictionary (zh/en/fr key parity + guide.rule1..9)
        # guide.rule1..9 已由 gen-hard-rules 落地,过渡开关 --skip-guide-rules 到此为止(12 §3.4)。
        run: node scripts/check-i18n.mjs
      - name: Bilingual doc structure parity
        shell: pwsh
        run: ./scripts/check-readme-parity.ps1
      - name: Dead link check (markdown-link-check)
        # .markdown-link-check.json 此前是一份**没有执行者**的配置:全仓没有 workflow
        # 也没有 gates 档位跑它,死链照样能进绿 CI,而下一个改文档的人不会知道要手工跑。
        # 排除项:docs/constitution 与 docs/design 是字节级只读归档(改一个字节就破坏
        # sha256 同步/设计稿比对),third_party 是 vendored 上游。
        run: |
          set -o pipefail
          files=$(git ls-files '*.md' \
            | grep -v '^docs/constitution/' \
            | grep -v '^docs/design/' \
            | grep -v '^third_party/')
          test -n "$files" || { echo "::error::no markdown files found"; exit 1; }
          npx --yes markdown-link-check@3 --config .markdown-link-check.json -q $files
