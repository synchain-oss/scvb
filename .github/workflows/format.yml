name: Format

on:
  pull_request:
    # [SL-277/J96,2026-09-02] CI 三档里的**轻档**:子 PR 不跑 build-vst3,但 format 的三个 job
    # (clang-format / web-smoke / docs-truth)全部保留 —— 它们都是 ubuntu 上的分钟级检查,
    # 省下的那 20 分钟是 Windows 编译,不是这里。三档定义见 build-vst3.yml 头注与 CLAUDE.md §4。
    branches: [dev, "feature/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, "feature/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format # required check context
    runs-on: ubuntu-latest # [R3] V-4 确认前一律 latest(§3.0 口径注)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned clang-format
        # 用 pip 版而非 apt 版:apt 的版本随 runner 镜像漂移,同一份代码在本地/CI 会格式化出不同结果。
        # 版本号必须与 scripts/gates.ps1 和 .clang-format 头注释里写的一致。
        run: pipx install clang-format==18.1.8
      - name: Check formatting
        run: |
          files=$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | grep -v '^third_party/')
          test -n "$files" || { echo "::error::no C++ sources found"; exit 1; }
          clang-format --dry-run --Werror --style=file $files
      - name: Check web assets formatting (prettier)
        # 与 scripts/gates.ps1 gate 3 **逐字相同**的一条命令;范围收敛全部交给 .prettierignore。
        # 版本必须钉死到补丁号,且与 gates.ps1 Gate 3、scripts/format.ps1(配对写入器)
        # **三处同步改**:`@3` 是浮动 major,本地 gates 与 CI 会在不同
        # 时间各自解析出不同的 prettier,于是同一份代码「本地绿、CI 红」而没有任何东西变过。
        run: npx --yes prettier@3.9.6 --check .

  web-smoke:
    name: web-smoke # required check context
    runs-on: ubuntu-latest # [R3] V-4 确认前一律 latest(§3.0 口径注)
    # 与 clang-format **平行**而非塞进同一 job:纯 web 的 PR 不该被 C++ 门禁的
    # 排队时间挡住;反过来 C++ 的 PR 也该照跑这套 —— web/ 是被 C++ 侧 WebView
    # 加载的真源。与 scripts/gates.ps1 的 Gate 3e 同口径。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 测试用到 node 内建 fetch 与全局 WebSocket;与 web-preview/README
          # 的「node ≥ 22」口径一致。
          node-version: "22"
      - name: Run web smokes
        # web-preview/tests/*.mjs 是 UI 侧**唯一**的行为门禁(纯函数 + mock 端到
        # 端 + 源码级纪律断言),T31–T36 六张卡的回归保护全压在上面。接入前没有
        # 任何 workflow 跑它们 —— 纯 web 的 PR 即使把八套全跑红,CI 也是全绿的。
        # 零 npm 依赖:不装包,直接 node 跑。不用 `|| exit 1` 提前退出,好让一次 CI
        # 就看全所有红项。
        #
        # 退出码约定(T46 起,[SL-297] 增第三档;与 scripts/gates.ps1 的 Gate 3e 同口径):
        #   0 = 全绿;1 = 有断言失败;**2 = 缺可选外部依赖(本机没有浏览器)**;
        #   **3 = 浏览器在,但这一次没起来 / 没连上**(CDP 端口没开出来 / spawn 失败)。
        #   2 与 3 都不判红(见下),区别只在**摘要里怎么显形** —— 压成同一个码时,
        #   一台装着浏览器的机器上一次瞬时超时会让整套判据无声消失而摘要照写全绿。
        #   (会回 2 的是**六套**页面级冒烟 —— smoke-monitor-page.mjs、
        #   smoke-output-stale-page.mjs、smoke-output-dist-page.mjs、
        #   smoke-seg-restore-page.mjs([SL-242] 段级「恢复自动」的作用域)、
        #   smoke-ui-layout-page.mjs([SL-272/275/276/273] header 几何、建议表留白、
        #   重分析弹窗)与 smoke-seg-diff-fold-page.mjs([SL-274] diff 摘要折叠 +
        #   泳道保底),都要一个无头 Chrome/Edge。执行面按 glob 自动收,
        #   加一套不必改这行)。
        # 2 记 ::warning:: 而**不**判红:这是 required check,一旦 runner 镜像哪天不再
        # 预装 Chrome,判红会把仓库里**每一个** PR 卡住,而它本来只是少跑一套。
        # 也绝不静默 —— warning 进 checks 摘要,长期没跑看得见。
        run: |
          shopt -s nullglob
          files=(web-preview/tests/smoke-*.mjs)
          test ${#files[@]} -gt 0 || { echo "::error::no web smokes found"; exit 1; }
          fail=0
          for f in "${files[@]}"; do
            echo "--- $f"
            node "$f"; rc=$?
            if [ $rc -eq 2 ]; then
              echo "::warning file=$f::skipped — 缺可选外部依赖(无头浏览器),本套未跑"
            elif [ $rc -eq 3 ]; then
              # [SL-297] 浏览器在、这一次没跑成。**同样不判红**(理由同下:required check
              # 判红会卡住每一个 PR),但措辞必须与 rc=2 分开 —— runner 上装着 Chrome 时
              # 报「缺可选外部依赖」是假话,而且会让人以为不用管。
              echo "::warning file=$f::FLAKY — 浏览器在但这一次没起来/没连上,本套**没跑成**(不是缺依赖);重跑通常即可"
            elif [ $rc -ne 0 ]; then
              echo "::error file=$f::web smoke failed"; fail=1
            fi
          done
          exit $fail

  docs-truth:
    name: docs-truth # required check context
    runs-on: ubuntu-latest # [R3] V-4 确认前一律 latest(§3.0 口径注)
    # 九条硬约束红字的唯一真源 = docs/USER_GUIDE.zh-CN.md 的 `## 硬约束` 小节,它要落到
    # markdown ×4 + i18n ×3 共 7 处(12 §3.4)。手抄必漂,而条目数 == 9 / grep「六条」/
    # check-i18n 的 key 全等这三道既有机检只查得出数量与标题,查不出条目**文本**漂移 ——
    # 逐字节比对生成物是唯一查得出的那道,所以它必须在 CI 里,不能只靠本地 gates。
    # 无 secrets ⇒ fork PR 也跑得动。前三步与 scripts/gates.ps1 的 Gate 3f 同口径,
    # 其后 IPC 对拍 = Gate 3g、字体覆盖 = Gate 3h,各与本地同一条命令;
    # 末步(markdown-link-check)只在 CI 跑 —— 它要联网,不该拖慢本地 gates 的回环。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        # 只为最后那步字体覆盖对拍。不用 runner 自带的 python3(compliance.yml 那种用法):
        # 自带版本随镜像漂,而本 job 是 required check —— 镜像换代时「同一份代码昨天绿今天红」
        # 的排查成本远高于多这一步。版本钉到次版本号,与 pip 锁版本一起构成可复现输入。
        with:
          python-version: "3.13"
      - name: Hard rules generator (--check)
        run: node scripts/gen-hard-rules.mjs --check
      - name: i18n dictionary (zh/en/fr key parity + guide.rule1..9)
        # guide.rule1..9 已由 gen-hard-rules 落地,过渡开关 --skip-guide-rules 到此为止(12 §3.4)。
        run: node scripts/check-i18n.mjs
      - name: Bilingual doc structure parity
        shell: pwsh
        run: ./scripts/check-readme-parity.ps1
      - name: IPC contract doc parity (doc <-> golden <-> headers)
        # 与 scripts/gates.ps1 的 Gate 3g **同一条命令**。docs/IPC_CONTRACT.md 是冻结契约,
        # 而它写的 offset / size / align / 常量 / 段名 / 落点算术此前只有人眼在看 —— #75
        # 那轮就是靠人审来回三次才收口,而「16..76」错成「16..80」评审 100% 看不出来。
        # 与 gen-hard-rules 同档放进 docs-truth:两者都是「文档 ↔ 真源」的逐字节对拍,
        # 只挂在本地 gates 上等于没有执行者。零依赖(仓内脚本 + 本 job 已有的 node),
        # 无 secrets ⇒ fork PR 也跑得动。
        # 不加 --strict:文档「未标注」按 WARN 走(判级理由见脚本头注),等契约 §5
        # 补齐标注后再把它收紧成红线。
        run: node scripts/check-ipc-doc-parity.mjs
      - name: Bridge parity (contract manifest <-> mock <-> C++ 常量表 <-> 已注册 handler)
        # [SL-258] **此前这个脚本没有任何执行者** —— 既不在 CI、也不在 gates、也不在
        # package.json。于是 [SL-256] 给它加的「已注册 handler ↔ manifest」断言,以及本卡
        # 扩到 input/monitor 三侧的版本,都只有人手动 `node` 才会红。
        # 同一族的洞因此栽了两次(`exportSuggestions` 与 `setGuideSeen`:契约齐全、常量在、
        # web 真调用,唯独没注册 handler),**即便门禁当时已经写好也照样栽**。
        # 判级理由与上面 IPC 契约对拍那条逐字同款:「只挂在本地 gates 上等于没有执行者」——
        # 而这一条连本地 gates 都没挂上。零依赖(仓内脚本 + 本 job 已有的 node),无 secrets。
        run: node scripts/check-bridge-parity.mjs
      - name: Curve parity (C++ LUT <-> JS 参考实现)
        # 同族幽灵门禁,一并接上执行者(本地实跑 exit=0,最坏偏差 9.6e-5 dB / 容差 0.01 dB)。
        run: node scripts/check-curve-parity.mjs
      - name: Design box parity (三侧窗口尺寸与缩放档位)
        # 同上(本地实跑 exit=0:output 1180x780 / input 460x560 / monitor 960x720)。
        run: node scripts/check-design-box.mjs
      - name: Smoke hygiene (页面级冒烟的 CDP 超时与收尾纪律)
        # [SL-287] 这一族有两个只在出事时才显形、而且不会让任何现有用例变红的形态:
        # CDP 调用没有截止时间(SL-274 实测挂过 75 分钟零输出;那次赶上 [SL-277] 拆锁前的
        # 形态所以还堵住了整批 —— 拆锁后 gate 1–5 不持锁,何况这里是 CI,压根没有那把锁),
        # 以及收尾只写在 happy path(本机已攒下近千个 scvb-* 残留目录)。
        # 两条都最容易在「照着旧模板复制一套新冒烟」时被漏掉,所以钉成机检而不是靠人记得。
        # 与 scripts/gates.ps1 Gate 3i 跑**逐字同一条命令**。零依赖、不联网、无 secrets。
        run: node scripts/check-smoke-hygiene.mjs
      - name: Native path filter teeth (build-vst3.yml 的 NATIVE_RE)
        # [SL-283] `detect-native` 的 NATIVE_RE 决定「子 PR 碰没碰 native 路径 ⇒ 要不要在
        # CI 上编一遍」。它被改坏的失效形态是**静默的**:动了 C++ 的子 PR 不再编译,而 CI
        # 照样全绿 —— 正是 [SL-283] 要补的那个洞原样复发,没有别的门禁会看见。
        # 所以判据本身也要有判据:正反例 + **删除式验证**(逐个删掉正则里的一个分支,都必须
        # 有正例变红 —— 防的是「写错到永不匹配的分支」也能让正反例全绿)。
        # 与本 job 里其它「生成物 ↔ 真源」对拍同档:正则从 build-vst3.yml 里读出来,不手抄,
        # 手抄两边会各自漂移,而漂移方向恰好是「测试还绿着,CI 已经不编了」。
        # 零依赖(仓内脚本 + 本 job 已有的 node),不联网、无 secrets ⇒ fork PR 也跑得动。
        run: node scripts/check-native-paths.mjs
      - name: Check gates degradation visibility
        # [SL-297] 断言 gates.ps1 的 Gate 3e 里 rc=3(浏览器在但没连上)有独立计数
        # **且计数接进了汇总标签**。与本地 gate 3i 跑同一条命令 —— 本仓的纪律是
        # 「只挂本地等于没有执行者」,反过来同样成立。
        run: node scripts/check-gates-visibility.mjs
      - name: Font subset coverage (UI text <-> web/fonts/*.woff2)
        # 与 scripts/gates.ps1 的 Gate 3h **同一条命令**。web/fonts/README.md 自己写着
        # 「不重跑 fetch_fonts.py 就会上屏方块,而 CI 查不出」—— 那句话在 2026-08 被兑现:
        # 子集自 #32 后没重跑,242 个所需字符没有字形(含「卡箍」这种正经词条用字)一路合进
        # feature/v1,八道门禁一道都没看见,因为当时根本没有一道门禁在看字体。
        # 与 gen-hard-rules / IPC 对拍同档放进 docs-truth:三者都是「生成物 ↔ 真源」的逐字对拍,
        # 只挂在本地 gates 上等于没有执行者(#75 与本卡各证明了一次)。
        # 不联网(只读仓内 woff2 与 web/ 源码)、无 secrets ⇒ fork PR 也跑得动。
        # pip 锁到补丁号:fontTools 的子集/cmap 行为随版本变,浮动版本会让「同一份字体
        # 昨天绿今天红」而中间什么都没改 —— 与 prettier@3.9.6 钉死是同一条纪律。
        run: |
          python -m pip install --disable-pip-version-check fonttools==4.60.1 Brotli==1.2.0
          python scripts/check-font-coverage.py
      - name: Dead link check (markdown-link-check)
        # .markdown-link-check.json 此前是一份**没有执行者**的配置:全仓没有 workflow
        # 也没有 gates 档位跑它,死链照样能进绿 CI,而下一个改文档的人不会知道要手工跑。
        # 排除项:docs/constitution 与 docs/design 是字节级只读归档(改一个字节就破坏
        # sha256 同步/设计稿比对),third_party 是 vendored 上游。
        run: |
          set -o pipefail
          files=$(git ls-files '*.md' \
            | grep -v '^docs/constitution/' \
            | grep -v '^docs/design/' \
            | grep -v '^third_party/')
          test -n "$files" || { echo "::error::no markdown files found"; exit 1; }
          npx --yes markdown-link-check@3.15.0 --config .markdown-link-check.json -q $files
