name: PR Agent

# Qodo PR-Agent —— DeepSeek,按量计费(三个 review bot 里唯一"每次 push 必跑"的一个)。
# 容器化(Docker container)action:slim runner 无 docker daemon,build 阶段会在 /var/run/docker.sock 上失败。
# fork PR 一律不跑(J31):pull_request 事件不向 fork 下发 secrets。
# 成本提醒(U8):v1 建议先 gh workflow disable,等观察到 claude-review 的盲区再开。
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest # 容器 action,slim 无 docker daemon 会挂
    permissions:
      issues: write # 只给这两个;故意不给 contents: write —— 收窄爆炸半径
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 1 }
      - uses: qodo-ai/pr-agent@8e4d32e5497defd43c023a404f73560c62728961 # v0.39.0 —— pin 到 commit SHA,升级手动改
        env:
          # ANTHROPIC.KEY / ANTHROPIC.API_BASE 是 pr-agent 专属的点号配置项:
          # pr-agent 会显式用自己 settings 里的 api_key 覆盖原始 litellm 环境变量,
          # 只设 ANTHROPIC_API_KEY 会被空值覆盖,导致 DeepSeek 返回 "api key invalid"。
          ANTHROPIC.KEY: ${{ secrets.DEEPSEEK_KEY }}
          ANTHROPIC.API_BASE: https://api.deepseek.com/anthropic
          # 以下两项是 litellm 兜底(双保险,缺一会返回 "api key invalid")
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_KEY }}
          ANTHROPIC_API_BASE: https://api.deepseek.com/anthropic
          GITHUB.USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 模型基线(用户决策 2026-08-10):默认 deepseek-v4-flash;litellm 不认 [1M] 括号,永远用裸名
          config.model: anthropic/deepseek-v4-flash
          config.fallback_models: anthropic/deepseek-v4-pro
          config.custom_model_max_tokens: 1000000 # 1M 档;切回不带 [1M] 的 pro 时改回 131072
          config.max_model_tokens: 900000 # 同上;切回 pro 时改回 120000
          # 必须显式含 "synchronize",否则 push 更新 PR 不复审(action runner 源码默认不处理 synchronize)
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.enable_output_relevant: "true"
