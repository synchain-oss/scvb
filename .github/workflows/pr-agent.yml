name: PR Agent (DeepSeek V4.1 Flash)

# pr-agent（describe / review / improve），DeepSeek V4.1 Flash 经 OpenCode Go，按量计费。
# 只在 PR → dev 上跑（base 过滤在中央 workflow 里做），PR 每次 push 都重跑。
# 模型、上限、超时、锁定的 pr-agent 镜像都在 Synchain-oss/ci-workflows 的 pr-agent.yml 里统一维护；
# 这里只放本仓专属的 ignore 列表。
#
# 这里故意不写 `branches:`：feature/v1 的分支保护把 `pr-agent / pr-agent` 列为必需检查，
# 触发器按 base 过滤会让 PR → feature/v1 永远等不到这个检查（pending）；
# 放进来再由中央 workflow 的 job 级 if 跳过，则报 skipped，必需检查视为通过。

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  pr-agent:
    permissions:
      contents: read        # pr-agent 要读 PR 文件与 .pr_agent.toml
      issues: write
      pull-requests: write
    uses: Synchain-oss/ci-workflows/.github/workflows/pr-agent.yml@5c5defd08f79a320261700a5c1d8696af5a20ec0 # v1.3.2
    with:
      provider: opencode-go
      ignore_globs: '["scripts/curve-parity-golden.json","docs/design/*","docs/images/*","screenshots*/*","third_party/miniz/*","third_party/notices/*","web/js/juce/*","web/fonts/*.woff2","tests/golden/state/*.bin","LICENSES/*","*.png","*.jpg","*.woff2"]'
    secrets:
      api_key: ${{ secrets.OPENCODE_GO_API_KEY_FOR_REVIEW }}
