name: Build & Validate

# ── CI 三档(SL-277 / [J96],2026-09-02 用户裁定)────────────────────────────
# 本节推翻 2026-08-19 那条「仓库已公开、Actions 免费,所有将并入 dev 的 PR(含 feature/**
# 子 PR)都跑完整 CI」的指令。用户新口径:「每次出包之前才跑完整 CI / 只有某些 branch 的 PR
# 才触发全量 CI / 尽可能多的本地编译 / 只要确保出包之前跑了全量 CI 就行」。
#
#   轻档  子 PR(base=`feature/**`)**且没碰 native 路径**:不跑本工作流。仍跑 format
#         (clang-format / web-smoke / docs-truth)、compliance(gitleaks / REUSE /
#         check-privacy / 设计盒)与三个 review bot。
#         **[SL-283] 修正**:碰了 native 路径(src / tests / cmake / CMakeLists.txt /
#         **web** / third_party / 钉版文件 / 本文件)的子 PR **照跑全量** —— 判定见下面
#         `detect-native` job。[J96] 原来一刀切跳过,结果是「动了 C++ 的子 PR 在 CI 侧
#         一次都不编译」,「CI 全绿」不再等价「native 编过」,下一张就可能把没编过的
#         C++ 合进去。本地 `scripts/gates.ps1`(CLAUDE.md §2)仍是第一道,但它靠人记得跑。
#   中档  里程碑 PR(base=`dev`)与 push→`dev`:照跑全量,与本工作流历史行为一致。
#   重档  **出包前硬门**:`workflow_dispatch`(input `ref`,默认 `feature/v1`)必须跑一次
#         并绿,才允许打包。这是 feature/v1 主支线唯一的机器编译证据 —— push→`feature/**`
#         触发已在本卡撤掉(每次子 PR 合入都冷编译 20 分钟,正是用户要省掉的那笔)。
#   逃生口 **子 PR** 打上 `ci:full` 标签即照跑全量(`types` 含 labeled/unlabeled,
#         job 的 `if:` 判标签)。**[SL-283] 之后它的用途收窄了**:碰了 native 路径的子 PR
#         已由 `detect-native` 自动照编,所以这个标签剩下的用处是「**没碰** native
#         (纯文档 / 脚本 / `web-preview/`)但仍想手动编一次」。
#         base=`dev` 的 PR **不吃**这个标签:它每次 synchronize 本来就跑全量,标签再起
#         一次只会在同一个 concurrency group 里排队重编;想临时再编一次用 dispatch。
#         **别靠反复打标签「刷新」构建**:标签事件的 `cancel-in-progress` 是 `false`
#         (见下面 concurrency 的注释 —— 那是为了不让无关标签打断构建而刻意选的),
#         所以在构建进行中重新打 `ci:full`,得到的是**排队再编一遍**,不是替换掉在跑
#         的那个。想替换只能用 `workflow_dispatch`,或者等它跑完。
#
# 分支保护 required contexts 不由本卡改(用户待办)。已核对:`dev` 无 required status
# checks;`feature/v1` 的 required contexts 只有三个 review bot —— 故子 PR 上本 job 被
# `if:` 跳过(不产生 check run)不会把任何 PR 卡在 pending。**注意前提**:[SL-283] 之后
# 只有**没碰 native 路径**的子 PR 才会被跳过;碰了的会照跑并产生 check run(结论不变 ——
# required contexts 只有三个 review bot,跑或不跑都不卡 pending)。

on:
  pull_request:
    # feature/** 留在触发面上有两个理由:**主要**是让 `detect-native` 有机会在子 PR 上做
    # 路径判定([SL-283] —— 碰了 native 路径就照编),**其次**才是 `ci:full` 逃生口要有事件
    # 可挂(事件级过滤掉就没有任何办法在子 PR 上手动开全量)。跑不跑由下面 job 的 `if:` 决定。
    branches: [dev, "feature/**"]
    types:
      [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [dev] # dev 快照 artifact(D3 通道2);feature/** 改由 workflow_dispatch 出
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 ref(出包前批次全量;默认主支线)"
        required: false
        default: feature/v1

concurrency:
  # dispatch 也进 group:同一 ref 连点两次只留最后一次;不同 ref 的两次 dispatch 互不取消。
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.ref || github.ref }}
  # **标签事件永不取消在跑的 run**(PR#176 复审采纳)。取消发生在 job `if:` **求值之前**,
  # 所以在 `cancel-in-progress: true` 下,给一个 base=dev 的 PR 加个无关标签
  # (`bug` / `Review effort 4/5` …)就会打断正在跑的全量构建 —— 而那正是本卡要省的
  # 那 20 分钟。只在 `if:` 里收窄标签名救不了:取消照样先发生,新 run 又被跳过,
  # 结果是构建被杀掉且没有任何东西顶上,比不改还差。
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  # ── detect-native([SL-283]):这个 PR 碰没碰「会影响 native 构建」的路径 ───────────
  # **为什么需要它**:[J96] 之后子 PR 一律跳过 build-and-validate,于是动了 C++ / CMake /
  # web 资源的子 PR 在 CI 侧**一次都不编译** —— 「CI 8/8 全绿」不再等价于「native 编过」。
  # 本 job 把这个缺口补回来:命中 native 路径的子 PR 照跑全量,纯文档 / 脚本 PR 仍跳过。
  #
  # **为什么不用 `on.pull_request.paths`**:那是**事件级**过滤,纯文档 PR 根本不会创建 run,
  # 于是给它打 `ci:full` 也**起不来** —— 逃生口会被一起过滤掉。路径判断必须在 job 级做,
  # 才能与标签支路、dispatch 支路并存。
  #
  # **为什么不用 `dorny/paths-filter` 之类**:org 的 action 白名单不放行 marketplace action
  # (sccache 就是因此改成钉版手动下载的),这里同样自己算 —— 反正只是一次 `git diff`。
  #
  # **失效方向**:任何一步出错都倒向 `native=true`(照编),绝不倒向「跳过」。倒错方向
  # 就是把本卡要补的洞原样又开一次,而且是静默的。
  detect-native:
    name: detect-native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # 只声明这一个 job 的权限,不动 build-and-validate 那边的 token
    outputs:
      native: ${{ steps.scan.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # pull_request 事件下 checkout 的是 refs/pull/N/merge 这个**合并提交**,
          # 它的 ^1 = base、^2 = head,所以 `git diff HEAD^1 HEAD` 正好是本 PR 的改动面。
          # 深度 2 就够拿到两个父提交;不要 fetch-depth: 0,那会把整个历史拉下来。
          #
          # **这是 PR 相对 base 的「累计」改动面,不是「最后一个 commit 改了什么」。**
          # 所以会看到「某个 commit 只改了文档,却仍然照编」—— 只要 PR 里**任何一个**
          # commit 碰过 native 路径就命中。这是对的:要回答的问题是「这个 PR 合进去之后
          # native 产物会不会变」。按单个 commit 判会漏 —— 先推一版改 `src/`、再推一版
          # 只改文档,后一次就会把前一次的编译需求判没了。别把这个形态当 bug 报。
          fetch-depth: 2
      - id: scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # 非 pull_request(push→dev / workflow_dispatch)一律照编:出包硬门与 dev 快照
          # 不受路径过滤影响,这个 job 对它们只是一道十几秒的直通(实测 6–8 秒)。
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "非 pull_request 事件($EVENT_NAME):直通,native=true"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 会影响 native 构建产物的路径。**清单是穷举的** —— 漏一条就等于给
          # 「改了它却没编」开口子,与 CLAUDE.md §6 版本真源那条同一族纪律。
          #   src/ tests/ cmake/ CMakeLists.txt  —— C++ 与构建脚本本体
          #   web/                               —— **经 juce_add_binary_data 编进二进制**
          #                                         (cmake/ScvbWebAssets.cmake),不是纯前端:
          #                                         文件名唯一性与 EXTRA_DIRS 是 configure 期
          #                                         FATAL_ERROR,import 闭包由 ctest 的
          #                                         test_web_assets_embedded 兜 —— 两道都只在
          #                                         编译时才跑,跳过构建就等于**这两道全不跑**
          #   third_party/                       —— vendored 上游(miniz 等)
          #   .*-version / .sccache-sha256       —— 钉版依赖变了就得重编(CLAUDE.md §6)
          #   build-vst3.yml                     —— 改构建配方本身,必须自己编一遍验证
          NATIVE_RE='^(src/|tests/|cmake/|web/|third_party/|CMakeLists\.txt$|\.juce-version$|\.pluginval-version$|\.sccache-version$|\.sccache-sha256$|\.github/workflows/build-vst3\.yml$)'

          # 两个开关都是**堵静默跳过**用的(PR#180 复审采纳),不是风格问题:
          #  `--no-renames`:改名检测默认开,`--name-only` 对一次改名只打印**目标**路径。
          #    于是 `src/core/Foo.cpp → docs/Foo.md` 只输出 `docs/Foo.md` ⇒ 不命中 ⇒ 不编,
          #    而源码树里那个 .cpp 已经没了。关掉检测,两侧路径都打印,源路径照样命中。
          #  `core.quotepath=false`:默认 true 会把非 ASCII 路径输出成 `"web/…"`(带前导
          #    双引号),`^web/` 就不匹配了。**本仓已经有这种路径**
          #    (`"docs/design/SCVB \350\256\276…dc.html"`),现在恰好落在 docs/ 所以无害;
          #    哪天 src/ 或 web/fonts/ 下出现一个中文名文件,就会静默跳过编译。
          # **先断言 HEAD 真的是那个合并提交**(PR#180 复审采纳)。上面 checkout 那段注释把
          # 「^1 = base」当成前提,但这个前提有一种破法:PR 有冲突时 GitHub 不更新
          # refs/pull/N/merge,checkout 可能落到 head commit 上 —— 那时 `HEAD^1` 变成
          # **子支线上一个 commit**,`git diff HEAD^1 HEAD` 收窄成「最后一次 push 改了什么」。
          # 于是「前面几个 commit 动过 src/、最后一次只改文档」的 PR 会被静默判 native=false。
          # diff 非空,所以走不进下面那条「取不到改动面」的兜底 —— 这是它自己的一档。
          # 让前提从隐含变成显式:没有第二个父提交就说明不在 merge ref 上,倒向照编。
          if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null 2>&1; then
            echo "::warning::HEAD 不是合并提交(PR 可能有冲突,merge ref 未更新)——改动面无从算起,保守判定 native=true(照编)"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git -c core.quotepath=false diff --no-renames --name-only HEAD^1 HEAD 2>/dev/null) || files=''
          if [ -z "$files" ]; then
            # 取不到改动面(浅克隆缺父提交 / PR 不可合并 / 合并提交形态变了)——
            # 这时**不能**判成「没碰 native」,那正好是静默跳过。倒向照编。
            echo "::warning::取不到本 PR 的改动文件清单,保守判定 native=true(照编)"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "本 PR 改动 $(echo "$files" | wc -l) 个文件"
          # `grep` 的退出码要分三档,不能用 `|| true` 一把吞掉(PR#180 复审采纳):
          # 0=有命中、1=无命中、**>=2 才是出错**(正则坏了 / 读失败)。吞掉的话出错会和
          # 「无命中」一起落进 else ⇒ native=false ⇒ 静默跳过,与上面「取不到改动面」
          # 那条同族却没有对称处理。
          hits=$(echo "$files" | grep -E "$NATIVE_RE") || rc=$?
          rc=${rc:-0}
          if [ "$rc" -ge 2 ]; then
            echo "::warning::grep 判定出错(exit=$rc),保守判定 native=true(照编)"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 文件名在 fork PR 上是外部可控内容,直接 echo 会让 `::error::` 之类前缀被 runner
          # 当 workflow 命令解释(只能造日志噪声,`set-output` 早已停用)。包一层 stop-commands
          # 把这段日志降级成纯文本。
          EOM="scvb-stop-$RANDOM$RANDOM"
          echo "::stop-commands::$EOM"
          if [ "$rc" -eq 0 ]; then
            echo "命中 native 路径,照跑全量构建:"
            echo "$hits" | sed 's/^/  /'
          else
            echo "未命中 native 路径(纯文档 / 脚本 / web-preview 等),跳过全量构建。"
            echo "改动面:"
            echo "$files" | sed 's/^/  /'
          fi
          echo "::$EOM::"
          if [ "$rc" -eq 0 ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-validate:
    name: build-and-validate # ← 这个字符串就是 required check 的 context,永不改名
    needs: detect-native
    # 三档 + 逃生口的唯一判定处。push / workflow_dispatch 一律跑;pull_request 只在
    # base=dev 或带 `ci:full` 标签时跑。**不要**把这条搬去 `on:` 的事件过滤 —— 标签
    # 是 PR 的属性而不是事件的属性,只有 job 级 `if:` 看得见。
    #
    # 写成**按 `action` 分家的两条互斥支路**,而不是「常规判据 || 标签判据」的嵌套
    # `||`(PR#176 复审采纳,三个 bot 同指)。理由是 `||` 从左往右短路:上一版把标签名
    # 的收窄放进第三个分支,而 base=`dev` 的 PR 在第二个分支 `github.base_ref == 'dev'`
    # 就已经为真,那段收窄**根本求不到** —— pr-agent 更新 `Review effort N/5`(bot 打
    # 标签是必然事件,本 PR 自己就有这个标签)即起一次 20 分钟全量,方向与本卡相反。
    # 改造前 `labeled` 不在 `types` 里 = 0 次,别把它变成每个里程碑 PR 多烧一次。
    # 分家写法让「标签事件」只有一个入口,以后往另一路加判据也不会被短路绕过去。
    #
    #   标签事件(labeled / unlabeled):只认 `ci:full` 这一个名字,**且**要求 PR 上此刻
    #     仍带着它,**且** base 不是 `dev` —— 打上 → 起一次全量;摘掉(`contains` 已为假)
    #     → 不起;别的标签增删 → 什么都不发生。收窄之所以安全,是因为上面的 concurrency
    #     已经保证标签事件不取消在跑的 run;两者顺序颠倒就会变成「构建被杀掉且没有东西
    #     顶上」,别拆开只留一行。
    #     `base_ref != 'dev'` 那一项:`ci:full` 是**子 PR 专用**的逃生口,dev PR 本来每次
    #     synchronize 就跑全量,再给它加标签只会在同一个 concurrency group 里排队重编
    #     一遍 —— 与被修掉的那条同形,只是触发者从 bot 换成了人。dev PR 上想临时再编一次
    #     用 `workflow_dispatch`,不要靠标签。
    #   非标签事件(opened / synchronize / reopened / ready_for_review):维持三档判据 ——
    #     base=`dev` 的里程碑 PR 跑全量;子 PR 在带 `ci:full` **或**碰了 native 路径时跑
    #     ([SL-283],见 detect-native 的头注)。
    #
    # `github.event.label.name` 在非标签事件上求值为 null(不是报错),所以两条支路各自
    # 的 `action` 判据就是它们互斥的保证。
    #
    # **`!cancelled()` 与 `!= 'false'` 是一对**([SL-283]):默认的 `success()` 会在
    # detect-native 挂掉时把本 job 一起跳过 —— 那是「因为探测坏了所以不编译」,方向反了。
    # 加 `!cancelled()` 让本 job 照样求值,而 detect-native 挂掉时 `outputs.native` 是空串,
    # 空串 `!= 'false'` 为真 ⇒ 照编。所以判据写成「**不是明确的 false** 就编」,而不是
    # 「等于 true 才编」—— 后者会把「探测失败」和「确实没碰 native」混为一谈。
    # 取消仍然有效:`!cancelled()` 不覆盖 concurrency 的取消。
    if: >
      !cancelled() &&
      (
      github.event_name != 'pull_request' ||
      (
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name == 'ci:full' &&
      contains(github.event.pull_request.labels.*.name, 'ci:full') &&
      github.base_ref != 'dev'
      ) ||
      (
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled' &&
      (
      github.base_ref == 'dev' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      needs.detect-native.outputs.native != 'false'
      )
      )
      )
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WEBVIEW2_NUGET_VERSION: "1.0.2957.106" # 必须与 CMakeLists 的 WEBVIEW2_VERSION 一致
      # sccache 用**本地磁盘缓存 + actions/cache 跨 run 搬运**,不用它的 GHA 后端:
      # 那个后端要 ACTIONS_RUNTIME_TOKEN / ACTIONS_RESULTS_URL,而这两个变量只发给
      # JS action,`run:` 步骤里拿不到 —— 想拿就得再引一个 action 去 exportVariable,
      # 换来的是又一个白名单外的依赖。磁盘缓存 + actions/cache(GitHub 自家,白名单放行)
      # 效果相同且少一层依赖。
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      # 上限给 1G:实测一次冷跑(500 个编译单元、JUCE + 5 个 target)之后 sccache 的
      # `Cache size` 是 **104 MiB**,1G 有十倍余量。**不要**随手写 2G —— sccache 只在
      # 超限时才 LRU 清理,给多少它就长到多少,而每次 run 都会把这份缓存写回一条
      # actions/cache 条目,仓库配额只有 10 GB(LRU 淘汰),撑大了会把 juce-* /
      # webview2-nuget-* 一起挤掉,表现为「CI 照样绿,只是又慢回去了」。
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 只有 workflow_dispatch 才用 input;其余事件留空 = actions/checkout 的默认
          # 行为(PR 用 merge ref、push 用 push 的 sha)。
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || '' }}

      # 0) 版本单一真源:JUCE / pluginval 版本只存在于仓库根的 .juce-version / .pluginval-version
      #    (12 §6.3 / D-12)。workflow 里不再硬编码 JUCE / pluginval 版本号字面量。
      #    同时算出 artifact 名用的 ref slug —— feature/v1 带斜杠,
      #    而 upload-artifact@v4 直接拒绝含 '/' 的 artifact 名。
      - name: Resolve pinned versions & ref slug
        shell: pwsh
        # `EFF_REF` 走 env 而**不是**直接把 `${{ }}` 插进脚本正文(PR#176 复审采纳):
        # dispatch 的 input 是人写的字符串,直接插值等于把它当代码拼进 PowerShell;
        # 经 env 传进来它永远只是一个值。能 dispatch 的虽然只有有写权限的人,但这条
        # 防线是免费的。
        env:
          EFF_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
        run: |
          # 钉版文件必须都在**被 checkout 的那棵树**上。workflow_dispatch 是唯一会让
          # 「workflow 定义」与「源码树」分家的通道:定义取自发起 run 的 ref,内容取自
          # input `ref`。把 input 指到一个还没有某个钉版文件的旧 ref,就会在这里挂。
          # 本卡实测踩过一次(run 33594229435:定义在 ci/SL-277-tiered-ci 上、内容是
          # feature/v1,后者当时还没有 .sccache-version)。挂在这一步比挂在半路好——
          # 报错要直接说出这个分家,不能只留一句 "Cannot find path"。
          # **这份清单是副本**:真源在 CLAUDE.md §6「版本单一真源」(那里五个,含
          # `.gitleaks-version`;本工作流不用 gitleaks,故这里四个)。新增钉版依赖时
          # 两处都要加 —— 只加真源、忘了这里,dispatch 旧 ref 又会退回裸
          # "Cannot find path"(PR#176 复审采纳)。
          $pins = @('.juce-version', '.pluginval-version', '.sccache-version', '.sccache-sha256')
          $missing = @($pins | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ("被构建的 ref 上缺少钉版文件:" + ($missing -join ', ') +
              "。workflow_dispatch 的 workflow 定义来自发起 run 的 ref,而源码来自 input ref —— " +
              "把 input 指到含这些文件的 ref(通常是已合并的 feature/v1),或先把它们合进目标分支。")
            exit 1
          }
          $juce = (Get-Content .juce-version -Raw).Trim()
          $pv   = (Get-Content .pluginval-version -Raw).Trim()
          if (-not $juce -or -not $pv) { Write-Error "空的 .juce-version / .pluginval-version"; exit 1 }
          "JUCE_TAG=$juce"      | Out-File $env:GITHUB_ENV -Append
          "PLUGINVAL_TAG=$pv"   | Out-File $env:GITHUB_ENV -Append
          # dispatch 时 github.ref_name 是发起 run 的那个 ref,不一定等于 input;以实际构建的 ref 为准。
          $slug = $env:EFF_REF.Replace('/', '-').Replace([char]92, '-')
          "REF_SLUG=$slug"      | Out-File $env:GITHUB_ENV -Append
          # 真正被 checkout 的那个 commit。**不能用 `github.sha`**:workflow_dispatch 时
          # 它是「发起 run 的 ref 的 HEAD」,而我们 checkout 的是 `inputs.ref` ——
          # 两者可以是不同的 commit,artifact 名里写错就等于溯源失效,而出包前那次
          # dispatch 产出的包,artifact 名是「这个包对应哪次提交」的唯一凭据。
          $built = (git rev-parse HEAD).Trim()
          if (-not $built) { Write-Error "取不到 HEAD sha"; exit 1 }
          "BUILT_SHA=$built"    | Out-File $env:GITHUB_ENV -Append
          Write-Host "built ref=$env:EFF_REF slug=$slug sha=$built"

      # 1) JUCE:浅克隆锁 tag(不用 FetchContent,避免上游漂移让 CI 突然红)。
      #    先查缓存 —— 键里带 tag,升级 .juce-version 自动换键。
      - name: Restore JUCE cache
        id: juce-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/JUCE
          key: juce-${{ runner.os }}-${{ env.JUCE_TAG }}

      - name: Clone JUCE (shallow, pinned)
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git "${{ github.workspace }}/JUCE"

      # 2) [V-3 定论] SCVB 零 vcpkg 依赖 —— 共享内存,无 ixwebsocket(那是 Bridge 的 WebSocket 依赖),
      #    故删掉 Setup vcpkg step 与 -DCMAKE_TOOLCHAIN_FILE/-DVCPKG_TARGET_TRIPLET,CI 提速。

      # 3) WebView2 Evergreen Runtime(windows-2022 是无桌面 Server,自带 Runtime 不保证)
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $exe
          Start-Process $exe -ArgumentList "/silent","/install" -Wait
          echo "WEBVIEW2_USER_DATA_FOLDER=$env:RUNNER_TEMP\wv2ud" >> $env:GITHUB_ENV

      # 4) 缓存 WebView2 NuGet 包(CMake 配置期拉到 build/packages)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/packages
          key: webview2-nuget-${{ env.WEBVIEW2_NUGET_VERSION }}

      # 4b) MSVC 开发环境 —— 换 Ninja 后必须先有 cl.exe/INCLUDE/LIB。
      #     不引第三方 setup-msvc action:那会把「哪个 MSVC」的决定权交给上游
      #     (与 compliance.yml 里 gitleaks 不用 marketplace action 同一条纪律);
      #     vswhere 是 VS Installer 自带的官方定位器,零新增依赖面。
      #     只把编译必需的几个变量写进 GITHUB_ENV,**不整份 dump env** —— 整份 dump
      #     会把多行值与其它 runner 变量一起灌进去,是一条现成的注入面。
      - name: Set up MSVC environment (vswhere)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere 不存在:$vswhere"; exit 1 }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "vswhere 没找到带 VC 工具集的 VS 安装"; exit 1 }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation | Out-Null
          # 白名单导出:PATH 与 MSVC 搜索路径变量。多行值一律拒绝(GITHUB_ENV 的
          # `K=V` 单行语法承不住,静默截断比报错更难查)。
          foreach ($k in @('PATH','INCLUDE','LIB','LIBPATH','VSINSTALLDIR','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','UCRTVersion')) {
            $v = [Environment]::GetEnvironmentVariable($k)
            if ($null -eq $v -or $v -eq '') { continue }
            if ($v -match "`n") { Write-Error "环境变量 $k 含换行,拒绝写入 GITHUB_ENV"; exit 1 }
            "$k=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          $cl = (Get-Command cl.exe -ErrorAction SilentlyContinue)
          if (-not $cl) { Write-Error "MSVC 环境已加载但 cl.exe 仍不在 PATH"; exit 1 }
          Write-Host "cl.exe = $($cl.Source)"
          # 工具集版本进 sccache 缓存键。从 VCToolsInstallDir 的末段取(形如 14.44.35207),
          # **不**去跑 `cl.exe` 读 banner —— 无输入文件时它退非零,会把整步染红。
          $tools = [Environment]::GetEnvironmentVariable('VCToolsInstallDir')
          if (-not $tools) { Write-Error "VCToolsInstallDir 为空,取不到工具集版本"; exit 1 }
          $msvc = Split-Path $tools.TrimEnd('\') -Leaf
          "MSVC_VER=$msvc" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MSVC toolset = $msvc"

      # 4c) Ninja —— CMAKE_<LANG>_COMPILER_LAUNCHER **只对 Makefile / Ninja 生成器生效**,
      #     Visual Studio(MSBuild)生成器会直接忽略它。所以要用 sccache 就必须换生成器,
      #     这不是可选项。用 Ninja Multi-Config 而不是单配置 Ninja:`--build --config Release`
      #     与 `ctest -C Release` 逐字不变,产物目录层级也与 VS 生成器同形(.../Release/VST3/…),
      #     下游 pluginval 与 artifact 的路径断言一条都不用改。
      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) { ninja --version; exit 0 }
          Write-Host "::warning::runner 镜像未预装 ninja,回退到 choco 安装"
          choco install ninja -y --no-progress
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { Write-Error "ninja 安装后仍不可用"; exit 1 }
          ninja --version

      # 4d) sccache —— MSVC 编译缓存。
      #     **不用 mozilla-actions/sccache-action**:org 的 action 白名单不放行它
      #     (首推实测 = startup_failure,原话「is not allowed in synchain-oss/scvb」),
      #     何况直接取发行版二进制本来就更合本仓纪律 —— compliance.yml 里的 gitleaks
      #     同样是「钉版手动下载」而不是 marketplace action,理由逐字同款:不把版本
      #     漂移权交给第三方。
      #     版本单一真源 = `.sccache-version`,完整性真源 = `.sccache-sha256`。
      #     **不**去下上游同目录的 `.sha256` 侧车文件:它和二进制同源同页,只能查传输
      #     损坏,查不出发行页被换 —— 那样的校验是摆设。
      - name: Install sccache (pinned + sha256)
        shell: pwsh
        run: |
          $ver  = (Get-Content .sccache-version -Raw).Trim()
          $want = (Get-Content .sccache-sha256  -Raw).Trim().ToLower()
          if (-not $ver -or -not $want) { Write-Error "空的 .sccache-version / .sccache-sha256"; exit 1 }
          $name = "sccache-v$ver-x86_64-pc-windows-msvc"
          $zip  = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/v$ver/$name.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { Write-Error "sccache 校验和不符: want=$want got=$got"; exit 1 }
          $dest = Join-Path $env:RUNNER_TEMP "sccache"
          Expand-Archive $zip -DestinationPath $dest -Force
          $bin = Join-Path $dest $name
          if (-not (Test-Path (Join-Path $bin "sccache.exe"))) { Write-Error "解包后没有 sccache.exe"; exit 1 }
          $bin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          New-Item -ItemType Directory -Force $env:SCCACHE_DIR | Out-Null
          & (Join-Path $bin "sccache.exe") --version

      # 4e) 把 sccache 的磁盘缓存跨 run 搬运。
      #     键里带 **MSVC 工具集版本 + 本仓 CMakeLists 的哈希**:换编译器或改构建脚本
      #     后旧对象大概率全不命中,让它换一把键重新长,而不是背着一坨死缓存。
      #     键尾加 run_id 是为了**每次都写回**(actions/cache 只在 key 未命中时保存;
      #     不加就永远只写第一次那份,后面新增的编译产物一个都存不下来),靠 restore-keys
      #     的前缀去捞上一次那份。
      - name: Restore sccache disk cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-${{ env.MSVC_VER }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt', 'cmake/*.cmake', '.juce-version', '.sccache-version') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ env.MSVC_VER }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt', 'cmake/*.cmake', '.juce-version', '.sccache-version') }}-
            sccache-${{ runner.os }}-${{ env.MSVC_VER }}-

      # 5) Configure —— 一次配置产出全部 5 个 target(core / Input / Output / tests / ipc_tests)
      #    **不再清 build/**:runner 是一次性的,build/ 里唯一的既有内容就是上面刚恢复的
      #    build/packages 缓存 —— 清掉它等于每次重下 WebView2 NuGet。原来那句
      #    `Remove-Item -Exclude packages` 是 VS 生成器时代为了躲开残留缓存写的,现在
      #    既无残留可躲,留着只会把缓存目录附近的东西一起删。
      - name: Configure CMake (Ninja Multi-Config + sccache)
        shell: pwsh
        run: |
          # 只传 `-DCMAKE_CONFIGURATION_TYPES=Release`,**不传** `-DCMAKE_BUILD_TYPE`
          # (PR#176 复审采纳):多配置生成器下配置由 `--build --config` / `ctest -C` 选,
          # `CMAKE_BUILD_TYPE` 一律被忽略。留着不会出错,只会让人以为它在起作用 ——
          # 下面 5b/6 的 `--config Release` 才是真正决定构建哪一档的地方。
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DJUCE_PATH="${{ github.workspace }}/JUCE" `
            -DSCVB_BUILD_TESTS=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { Write-Error "configure failed"; exit 1 }

      # 5b) Build + 零 warning 断言(ADR-011 的 /W4 门在 CI 侧的机器强制)
      - name: Build (fail on any MSVC warning)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { Write-Error "build failed"; exit 1 }
          $w = Select-String -Path build.log -Pattern 'warning C' | Where-Object { $_.Line -notmatch 'JUCE' -and $_.Line -notmatch '_deps' -and $_.Line -notmatch 'vcpkg' }
          if ($w.Count -gt 0) {
            $w | ForEach-Object { Write-Host "::error::$($_.Line)" }
            Write-Error "MSVC 告警 $($w.Count) 条,ADR-011 要求 /W4 零 warning"; exit 1
          }

      # 5c) 缓存命中率进日志。sccache 失效的形态是**静默零命中**(缓存没恢复上、键变了、
      #     编译参数不可缓存),CI 照样全绿只是慢回 20 分钟。不打印就没人会发现。
      #     **一条已知的「命中率恒为 0」成因**:sccache 对 MSVC 的 `/Zi`(独立 PDB)
      #     不可缓存,只有 `/Z7`(调试信息嵌进 obj)可缓存。本仓 Release 不带调试信息
      #     格式,所以现在没事;但哪天 JUCE 或 CMakeLists 给 Release 加上 `/Zi`,
      #     表现就是这里 `Cache misses` 一直 100% 而 CI 全绿。先记在这,省得下次
      #     有人对着 0 命中猜半天。
      #     顺手停掉 server:让它把内存里的索引落盘,之后 actions/cache 的 post 步
      #     搬走的才是完整的一份。
      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          # 前面某步先挂掉时 sccache 可能根本没装上;诊断步不该把 run 再染红一次。
          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::sccache 不在 PATH,本次没有编译缓存统计可看"
            exit 0
          }
          sccache --show-stats
          Write-Host "::notice::上面的 'Cache hits' / 'Cache misses' 就是本次编译缓存的实际收益"
          sccache --stop-server | Out-Host
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: SCVB-build-log-${{ env.BUILT_SHA }}
          path: build.log
          retention-days: 7

      # 6) Catch2 单测(ADR-011:scvb_core 全离线可测)
      # [SL-320] `--timeout 300` 与 `scripts/gates.ps1` gate 6 **逐字同值**,职责也同一条:
      # 只给**没有 TIMEOUT 属性**的测试兜底。各套真正的上界写在自己的 TIMEOUT 属性里,
      # 属性跟着测试走,两边同吃一份;**每一套**都有属性,所以这个数今天一套都管不到
      # (写「每一套」而不是写套数:套数是个跨文件计数,第八套一落地,写着套数的每一处一起变假)。
      # [SL-338] ⚠ **哪套多少秒、写在哪个文件,不抄在这里**。上一版这段抄了整张值表 + 每个值的
      #   所在文件,而它已经漂过一次(SL-325:原先写「前六套在 `tests/CMakeLists.txt`」——
      #   文件是对的、**六**是错的)。要问「谁有属性、各是多少」,读 ctest 真正吃的那份
      #   `build*/**/CTestTestfile.cmake`;要问「有没有人漏写属性」,那是本 workflow 里
      #   `check-ctest-timeouts.ps1` 那两步(与本机 gate 5b 同一条命令)当门禁在判的事。
      #   ([SL-338 复审] 不写「上面/下面」:方位词与行号同族,这一段插一步、挪一步它就静默变假。)
      # 此前这里**不带** `--timeout`,于是没有属性的套件在**出包硬门**上吃 ctest 默认的 1500s、
      # 本机吃 gates 的 300 —— 同一个「上界」两个真源、差 5 倍。两边都写上之后,
      # 「新加的测试忘了写属性」在两条路上的行为也一致,不会再一边宽一边紧。
      - name: ctest 上界属性门禁自测
        # [SL-325] 先自测再实扫,与 format.yml 的两条门禁同款:实扫绿有两种可能 ——
        # 「七套真的都有属性」和「判据被改坏了」,自测把后一种单独照出来。
        # **两步分开写、不合成一个 `run: |` 块**:pwsh 块只把**最后一条**命令的退出码带出去,
        # 自测红、实扫绿会让整步变绿 —— 正是本仓「SKIP 吞掉判据」那一族的形态。
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-ctest-timeouts.ps1 -SelfTest
      - name: ctest 上界属性完备(读生成物 CTestTestfile.cmake)
        # [SL-325] 上面那句「七套全部有属性」是**当下事实,没有执行者**。新加一个测试目标、
        # 忘了写 `set_tests_properties(... TIMEOUT ...)`,它会静默退回 CTest 默认的 1500s ——
        # 本机与 CI 都不会红,因为「有个上界」看起来是对的。判据读 configure 的生成物,
        # 而不是手边的 CMakeLists:属性可以写在任何一个 CMakeLists 里,也可以被开关控制。
        # 与本地 `gates.ps1` gate 5b 跑同一条命令。
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-ctest-timeouts.ps1 -BuildDir build
      - name: Unit tests (ctest)
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --timeout 300

      # 7) pluginval —— 三个 bundle 都必须过
      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_TAG/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate all VST3 bundles
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path build -Recurse -Filter "*.vst3" -Directory
          if ($bundles.Count -ne 3) {
            Write-Error "Expected exactly 3 .vst3 bundles (SCVB Input / SCVB Output / SCVB Monitor), found $($bundles.Count)."
            exit 1
          }
          foreach ($b in $bundles) {
            Write-Host "::group::pluginval $($b.Name)"
            & ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 60000 --skip-gui-tests --output-dir "$env:RUNNER_TEMP/pluginval-logs" "$($b.FullName)" 2>&1 | Out-Host
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { Write-Error "pluginval failed for $($b.Name) (exit $code)"; exit 1 }
          }
          Write-Host "Non-GUI strictness-5 passed for all three plugins; full GUI validation is a LOCAL gate (see scripts/gates.ps1)."

      # 8) artifact(命名/保留策略见 §6.3)
      - name: Upload VST3 (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SCVB-VST3-win64-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: build/**/*.vst3
          if-no-files-found: error
          retention-days: 14

      - name: Upload VST3 (dev snapshot)
        if: github.event_name == 'push' && github.ref_name == 'dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SCVB-VST3-win64-dev-${{ github.sha }}
          path: build/**/*.vst3
          if-no-files-found: error
          retention-days: 30

      - name: Upload VST3 (preview / 出包前批次全量)
        # push→feature/** 撤掉后,预览通道(D3 通道3)改由本条产出 —— 出包前那次
        # dispatch 既是硬门也是取包处。**这一步不能漏**:漏了就得为了拿包再跑一次全量。
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # 用 REF_SLUG 而不是原始 ref:feature/v1 含 '/',upload-artifact@v4 会直接
          # 报 Invalid artifact name。
          name: SCVB-VST3-win64-preview-${{ env.REF_SLUG }}-${{ env.BUILT_SHA }}
          path: build/**/*.vst3
          if-no-files-found: error
          retention-days: 30

      - name: Upload pluginval logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SCVB-pluginval-logs-${{ env.BUILT_SHA }}
          path: ${{ runner.temp }}/pluginval-logs
          retention-days: 7
          if-no-files-found: ignore
