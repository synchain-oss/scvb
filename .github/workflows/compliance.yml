name: Compliance
# 三仓逐字取本节;仓库间唯一差异 = 无。它不读任何 secret,也不 checkout 子模块。
on:
  pull_request:
    # [SL-277/J96,2026-09-02] CI 三档里的**轻档**:子 PR 不跑 build-vst3,但 compliance 全部保留
    # —— 密钥/许可/隐私门禁一旦漏跑,坏东西就进了公开仓的历史,和「慢 20 分钟」不是一个量级。
    # 三档定义见 build-vst3.yml 头注与 CLAUDE.md §4。
    branches: [dev, "feature/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, "feature/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 只读,fork PR 亦然;绝不向 fork PR 供密(J20)

jobs:
  compliance:
    name: compliance # required check context,永不改名,永不加 if:
    runs-on: ubuntu-latest # V-4 确认前一律 latest(§3.0 口径注)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned gitleaks version
        id: ver
        run: echo "v=$(tr -d '[:space:]' < .gitleaks-version)" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks (pinned)
        # 版本钉在 .gitleaks-version,与 .juce-version / .pluginval-version 同模式;
        # 不用 marketplace action(它会把版本漂移权交给第三方,且部分版本要 secrets)。
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ steps.ver.outputs.v }}/gitleaks_${{ steps.ver.outputs.v }}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan
        # 与 §5.1 gate 3b 逐字同参,否则「本地绿 / CI 红」会成为常态
        run: gitleaks detect --no-git --source . --redact -v --config .gitleaks.toml
      - name: REUSE lint
        # 与 §5.1 gate 3c 逐字同参
        run: pipx run reuse lint
      - name: Design-box single-source check
        # 设计盒常量唯一真源守卫:生成物 src/core/DesignBox.h 与 web/shared/design-box.js 对拍
        # (与 gates.ps1 gate 3d 同参;纯脚本步骤,不引入新 action)
        run: python3 scripts/gen-design-box.py --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # [SL-265] 钉版而非用 runner 自带 node:自带版本的大版本由 GitHub 单方面滚动,
          # 而本仓其余 node 门禁(web-smoke / docs-truth)都经 setup-node 钉在 22 —— 隐私门禁
          # 跟同一口径,免得哪天 runner 换代变成「本地绿 / CI 行为不同」。脚本内另有 >=18 守卫兜底。
          node-version: "22"
      - name: Privacy gate self-test
        # [SL-265] **先自检再扫**:这条门禁的失效模式是「静默放行」—— 针被改坏或豁免表被放宽后,
        # 扫描照样退 0,门禁看着绿其实什么都没拦(幽灵门禁)。自检用内置坏样例验证四条规则确实
        # 会命中、且豁免样例确实不命中;它红了说明门禁本身坏了,比扫描结果更要紧,故排在前面。
        # 与 gates.ps1 gate 3j 同参。
        run: node scripts/check-privacy.mjs --self-test
      - name: Privacy scan
        # [SL-265] 公开仓隐私门禁:代号禁词(零容忍)/ 个人本机路径 / 个人邮箱域 / 个人主机名。
        # 放在 compliance 而非 format:同族是本 job 里的 gitleaks(密钥)与 REUSE(合规),
        # gates 侧也挂在 3b(gitleaks)旁,两侧位置对应。与 gates.ps1 gate 3j 同参。
        run: node scripts/check-privacy.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        # [SL-267] 只为下面两步字体保留名断言。钉版理由同 format.yml 的 docs-truth:
        # runner 自带 python 的版本随镜像漂,而本 job 是 required check。
        # **排在 Design-box 那步之后**:setup-python 会把 3.13 抢到 PATH 最前,而那一步用的是
        # runner 自带 python3 —— 顺序一换就等于顺手改了另一道门禁的解释器。
        with:
          python-version: "3.13"
      - name: Font reserved-name gate self-test
        # [SL-267] **先自检再扫**,与上面隐私门禁两步同款:本门禁的失效模式同样是「静默放行」
        # —— 署名豁免表被放宽、或子串比对被写成相等比对之后,扫描照样退 0,门禁看着绿其实
        # 什么都没拦。自检红说明门禁本身坏了,比扫描结果更要紧,故排在前面。
        # pip 锁到补丁号,与 docs-truth 的字体覆盖那步同版本:fontTools 的 name 表读写行为
        # 随版本变,浮动版本会让「同一份字体昨天绿今天红」而中间什么都没改。
        # 与 gates.ps1 gate 3k 同参。
        run: |
          python -m pip install --disable-pip-version-check fonttools==4.60.1 Brotli==1.2.0
          python scripts/check-font-names.py --self-test
      - name: Font reserved-name scan (OFL-1.1 §3)
        # [SL-267] 断言随 .vst3 分发的四款 woff2 的 `name` 表、以及同样进包的 .css/.js/.html
        # 里的字体栈字面量,都不含上游保留字体名(RFN)。
        # 与 gitleaks / REUSE 同族(都是「分发物合规」),故落在 compliance 而非 docs-truth:
        # docs-truth 的字体覆盖(gate 3h)问的是「字够不够」,这一条问的是「名字能不能用」。
        # 不联网(只读仓内 woff2)、无 secrets ⇒ fork PR 也跑得动。与 gates.ps1 gate 3k 同参。
        run: python scripts/check-font-names.py
