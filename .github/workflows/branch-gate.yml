name: Branch Gate

# 晋升链(v1 只有 dev 一条长期分支):
#   feat/* | feature/*  ->  dev            (same-repo)
#   任意分支名(除长期分支名) -> dev        (fork,J31/J41)
# 子 PR(base=feature/*)故意不受此命名门禁约束(D2)。
# [SL-277/J96,2026-09-02] 子 PR 已回到轻档 CI(不跑 build-vst3);本工作流的触发面不受影响
# —— 它本来就只挂 pull_request→dev。
# 发版里程碑再打开下面被注释的 prod/stage 规则。

on:
  pull_request:
    branches: [dev] # 发版后改为 [prod, stage, dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read # 读 commit 列表做 DCO 断言;fork PR 下本就是只读

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-gate:
    name: branch-gate # required check context,永不改名,永不加 if:
    runs-on: ubuntu-latest # [R3] V-4 确认前一律 latest(§3.0 口径注);三仓 branch-gate 逐字取本节
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # ① 机器人 PR 先放行命名规则:dependabot 的 head 形如
          #    dependabot/github_actions/actions-checkout-5,永远不匹配 feat/*|feature/*。
          #    不放行的话每条依赖升级 PR 都会被 required check 红叉,只能靠 admin bypass
          #    ——12 §6.3 的整套依赖更新策略会在开源第一个月瘫痪。
          #    注意:dependabot 分支本就是同仓分支,这条不放松任何 fork 判定。
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "bot PR ($ACTOR): skip branch naming rule"; exit 0
          fi

          # ② fork PR(J31/J41):允许,但不得用长期分支名伪装晋升;不强制 feat/*|feature/* 命名。
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            case "$HEAD" in
              dev|stage|prod|feature/v1|feature/extraction)
                echo "::error::Fork PR head branch must not be named '$HEAD' (reserved long-lived branch name)."
                exit 1 ;;
            esac
            echo "External (fork) PR from $HEAD_REPO:'$HEAD' -> '$BASE' — naming rule skipped."
            echo "Maintainer: please add the 'external' label manually (fork PRs get a read-only token)."
            exit 0
          fi

          # ③ same-repo:维持晋升规则
          if [ "$BASE" = "dev" ]; then
            case "$HEAD" in
              feat/*|feature/*|dependabot/*) ;;
              *) echo "::error::Only 'feat/*' or 'feature/*' can merge into 'dev'. Got: '$HEAD'"; exit 1 ;;
            esac
          fi
          # --- 发版后启用 ---
          # if [ "$BASE" = "prod" ] && [ "$HEAD" != "stage" ] && [ "$HEAD" != "dev" ]; then ... fi
          # if [ "$BASE" = "stage" ] && [ "$HEAD" != "dev" ]; then ... fi
          echo "Branch gate passed: '$HEAD' -> '$BASE'"

      # DCO —— 12 §1.4 把 Signed-off-by 定为贡献前提,而 PR 模板里的勾选框是纯自觉。
      # DCO 是本项目唯一的入站许可证凭据(不采用 CLA),在 GPLv3 + 可能追加 §7 例外的场景下,
      # 一条无 sign-off 的外部 commit 就会让后续修改例外条款必须逐一联系贡献者。
      # 用内联 gh api 实现,不引第三方 action(org 的 allowed_actions 是白名单,第三方 DCO action 会被拦)。
      - name: DCO check (all commits must be signed off)
        # 显式 shell: bash ⇒ Actions 以 `bash --noprofile --norc -eo pipefail` 执行;默认 shell 只有 -e、
        # 没有 pipefail,管道尾的 wc/tr 会把 gh api 的限流/5xx 吞成退出码 0,total=0 让 250 守卫静默放行
        # (SCVB 线 SL-308 发现)。下面再显式 set -euo pipefail 一次,不依赖 runner 的默认参数。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # fork PR 下也可用(只读足够)
        run: |
          set -euo pipefail
          # 端点只调**一次**并落盘,计数与筛选读同一份快照:两次调用之间若有人 push,total 与 dco-bad.txt
          # 会来自不同的 commit 列表;且任一次失败都必须让 step 失败(fail-closed),不能各自静默。
          # --paginate 不带 --jq 时每页输出一个 JSON 数组首尾相接,jq -s add 合成一个数组。
          gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" > "$RUNNER_TEMP/commits.raw.json"
          jq -s 'add' "$RUNNER_TEMP/commits.raw.json" > "$RUNNER_TEMP/commits.json"
          # 响应体必须是数组:错误体 {"message":…} 经 `length` 得到的是键数、也是合法整数,下面两道计数
          # 守卫都会放过,只能靠更下游的 .parents 报错偶然 fail —— 在这里显式断言类型(SCVB 线 SL-317)。
          if ! jq -e 'type == "array"' "$RUNNER_TEMP/commits.json" > /dev/null; then
            echo "::error::commits API did not return a JSON array (got: $(jq -c 'if type == "object" then {message} else type end' "$RUNNER_TEMP/commits.json")); refusing to pass the DCO check"
            exit 1
          fi
          total=$(jq 'length' "$RUNNER_TEMP/commits.json")
          # 先证明它是十进制整数再比较:`set -e` 不覆盖 if 条件,`[ "" -lt 1 ]` 只会报 integer expected
          # 然后条件为假、落到放行路径(SCVB 线 SL-313)。
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "::error::commits API count is not an integer ('$total'); refusing to pass the DCO check"
            exit 1
          fi
          # /pulls/{n}/commits 有 250 条硬上限,--paginate 也不会突破:超过的 commit 不会进下面的
          # 筛选,门禁会静默半程放行。主支线累积多个子 PR 后整体晋升 dev 的模式下 commit 数随支线
          # 长度单调增长,故超限直接 fail(许可证门禁不能半程有效),让维护者拆 PR(采纳 #24 review)。
          # 计数为 0 同样 fail:PR 至少有 1 个 commit,0 只可能是 API 回了空响应或分页拼接出错。
          if [ "$total" -lt 1 ]; then
            echo "::error::commits API returned $total commits for this PR; refusing to pass the DCO check on an empty list"
            exit 1
          fi
          if [ "$total" -ge 250 ]; then
            echo "::error::PR has $total commits (>= 250): the commits API truncates and the DCO check would silently skip the rest; split the PR"
            exit 1
          fi
          echo "DCO: checked $total commits"
          # 用 jq 直接筛出"消息里没有 Signed-off-by 行"的 commit,避免在 shell 里切多行 message。
          # merge commit(parents > 1)豁免:GitHub 网页「Merge pull request」生成的 merge commit 无法带
          # sign-off,而主支线(feature/*)按子 PR 逐个合并后再晋升 dev 时,这些 merge 必然出现在 PR 的
          # commit 列表里(首次触发:#24,feature/macos 含 #19-#21 的三个网页 merge)。merge commit 本身
          # 不引入新贡献内容(冲突解决除外,维护者手工 merge 时仍应 `git merge -s` / `--amend -s`),
          # 每个非 merge commit 仍逐个受检 —— 与 DCO GitHub App 的默认行为一致。
          jq -r '.[] | select((.parents | length) < 2) | select((.commit.message | test("(?im)^Signed-off-by: .+ <.+@.+>$")) | not) | .sha' "$RUNNER_TEMP/commits.json" > "$RUNNER_TEMP/dco-bad.txt"
          if [ -s "$RUNNER_TEMP/dco-bad.txt" ]; then
            while read -r sha; do
              echo "::error::commit $sha 缺少 Signed-off-by(提交时用 git commit -s;补救:git commit -s --amend 或 git rebase --signoff)"
            done < "$RUNNER_TEMP/dco-bad.txt"
            exit 1
          fi
          echo "DCO ok"

      # 冻结契约 path guard —— CODEOWNERS 在本项目的分支保护下只有"自动 request review"的装饰作用
      # (§7.2 把 required_pull_request_reviews 设为 null,理由见该节),所以冻结文档需要一条
      # 真正机器可验的守卫,与 §3.2 的三条 golden 测试互补。
      - name: Frozen-contract change guard
        # 与上面 DCO 步同一套加固(SCVB 线 SL-310,与 SL-308 同族):显式 bash + pipefail;端点只调一次落盘;
        # API 回 [] 或分页掉页时 files 为空 ⇒ touched 为空 ⇒ 守卫会静默放行,故文件数 < 1 直接 fail
        # (PR 至少改 1 个文件,与「至少 1 个 commit」同强度)。判据本身不变。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" > "$RUNNER_TEMP/files.raw.json"
          jq -s 'add' "$RUNNER_TEMP/files.raw.json" > "$RUNNER_TEMP/files.json"
          # 响应体必须是数组(同 DCO 步,SCVB 线 SL-317):错误体是对象,length 得键数照样是整数。
          if ! jq -e 'type == "array"' "$RUNNER_TEMP/files.json" > /dev/null; then
            echo "::error::files API did not return a JSON array (got: $(jq -c 'if type == "object" then {message} else type end' "$RUNNER_TEMP/files.json")); refusing to pass the frozen-contract guard"
            exit 1
          fi
          nfiles=$(jq 'length' "$RUNNER_TEMP/files.json")
          # 先证明它是十进制整数再比较:`set -e` 不覆盖 if 条件,`[ "" -lt 1 ]` 只会报 integer expected
          # 然后条件为假、落到放行路径(SCVB 线 SL-313)。
          if ! [[ "$nfiles" =~ ^[0-9]+$ ]]; then
            echo "::error::files API count is not an integer ('$nfiles'); refusing to pass the frozen-contract guard"
            exit 1
          fi
          if [ "$nfiles" -lt 1 ]; then
            echo "::error::files API returned $nfiles changed files for this PR; refusing to pass the frozen-contract guard on an empty list"
            exit 1
          fi
          # /pulls/{n}/files 有 3000 条硬上限(与 DCO 步的 250 同理):截断时后面的文件根本不在列表里,
          # 守卫会静默半程放行,故触顶直接 fail,让维护者拆 PR。
          if [ "$nfiles" -ge 3000 ]; then
            echo "::error::PR touches $nfiles files (>= 3000): the files API truncates and the frozen-contract guard would silently skip the rest; split the PR"
            exit 1
          fi
          echo "frozen-contract guard: checked $nfiles files"
          # 重命名也算触碰:只看 .filename 会让 `git mv docs/IPC_CONTRACT.md docs/ipc-v2.md` 不触发守卫、
          # 不需要变更文档就过 —— 比就地改一行更危险。status=="renamed" 的条目带 previous_filename,一并纳入。
          files=$(jq -r '.[] | (.filename, (.previous_filename // empty))' "$RUNNER_TEMP/files.json")
          touched=$(printf '%s\n' "$files" | grep -E '^(docs/PARAMETERS\.md|docs/IPC_CONTRACT\.md|docs/STATE_SCHEMA\.md|docs/SCVB_CONTRACT\.md|tests/golden/)' || true)
          if [ -n "$touched" ]; then
            # 凭据面与触碰面分开取:触碰面尽量宽(含 renamed 旧路径),凭据面尽量严 —— 只认 status 为
            # added / modified 且落在 docs/contract-changes/ 下的文档。若共用上面的 $files,把一份旧变更文档
            # `git mv` 走(previous_filename 命中)或 `git rm` 掉(filename 仍在列表)都会被当成「已交变更文档」
            # 放行(SCVB 线 SL-317 实证)。renamed 而来的文档也不算数:改名不等于为本次触碰写了说明。
            doc=$(jq -r '.[] | select(.status == "added" or .status == "modified") | .filename' "$RUNNER_TEMP/files.json" \
              | grep -E '^docs/contract-changes/[0-9]{8}-.+\.md$' || true)
            if [ -z "$doc" ]; then
              echo "::error::本 PR 触碰了冻结契约文件:"; printf '  %s\n' $touched
              echo "::error::必须在同一个 PR 里新增 docs/contract-changes/<YYYYMMDD>-<slug>.md(模板见 docs/contract-changes/TEMPLATE.md),并挂 status/frozen-contract 标签由用户批准。"
              exit 1
            fi
          fi
